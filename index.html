<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sulynn Hago: Night Summer Heat Tour</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0a0a14;color:#fff;font-family:'Courier New',monospace;height:100%;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 40px #ff2a6d55,0 0 60px #2a6cff33,0 0 0 4px #1a1a2a inset;max-width:100vw;max-height:100vh}
  #hint{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:#999;letter-spacing:1px;pointer-events:none;text-align:center;text-shadow:0 0 4px #000}
  #hint b{color:#ffcd2a}
  #yt{position:fixed;top:-9999px;left:-9999px;width:2px;height:2px;opacity:0;pointer-events:none}
  #audio-banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#ffcd2a;padding:6px 14px;font-size:12px;letter-spacing:1px;border:1px solid #ffcd2a;display:none;z-index:10;border-radius:2px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="320" height="240"></canvas></div>
<div id="yt"></div>
<div id="audio-banner">CLICK GAME TO START MUSIC</div>
<div id="hint">ARROWS / WASD move &nbsp;·&nbsp; <b>Z</b> action &nbsp;·&nbsp; <b>X</b> back &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; click canvas to focus</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(() => {
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');
const mainCtx = ctx;
function bakeWith(w, h, fn){
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const prev = ctx;
  ctx = oc.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  fn();
  ctx = prev;
  return oc;
}
ctx.imageSmoothingEnabled = false;
const W = 320, H = 240;

function fit(){
  const s = Math.max(1, Math.min(Math.floor(window.innerWidth/W), Math.floor((window.innerHeight-30)/H)));
  cvs.style.width = (W*s)+'px';
  cvs.style.height = (H*s)+'px';
}
fit(); addEventListener('resize', fit);
cvs.addEventListener('click', () => { cvs.focus(); startMusic(); });
cvs.tabIndex = 0; cvs.focus();

/* ───────────────────────── YOUTUBE MUSIC ───────────────────────── */
let ytPlayer = null, ytReady = false, ytPlaying = false;
const SONG_ID = 'nUXh3QAd3z0'; // Sulynn Hago – Night Summer Heat (Official Music Video)
window.onYouTubeIframeAPIReady = () => {
  ytPlayer = new YT.Player('yt', {
    height: '2', width: '2',
    videoId: SONG_ID,
    playerVars: { autoplay:0, loop:1, playlist:SONG_ID, controls:0, modestbranding:1, playsinline:1, rel:0 },
    events: {
      onReady: () => { ytReady = true; ytPlayer.setVolume(55); },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) ytPlaying = true;
        if (e.data === YT.PlayerState.ENDED) { try{ ytPlayer.playVideo(); }catch(_){} }
      },
    },
  });
};
function startMusic(){
  if (!ytReady || ytPlaying) return;
  try { ytPlayer.playVideo(); document.getElementById('audio-banner').style.display='none'; } catch(_){}
}
function setMusicVol(v){ if (ytReady) try{ ytPlayer.setVolume(v); }catch(_){} }
function showAudioBanner(){
  document.getElementById('audio-banner').style.display='block';
  setTimeout(()=>{ if(!ytPlaying) document.getElementById('audio-banner').style.display='none'; }, 8000);
}
setTimeout(showAudioBanner, 1500);

/* ───────────────────────── INPUT ───────────────────────── */
const keys = {};
const edge = {};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  const k = norm(e.key);
  if (!keys[k]) edge[k] = true;
  keys[k] = true;
  startMusic();
});
addEventListener('keyup', e => { keys[norm(e.key)] = false; });
function norm(k){
  k = k.toLowerCase();
  return ({'arrowup':'up','arrowdown':'down','arrowleft':'left','arrowright':'right',
           'w':'up','s':'down','a':'left','d':'right',
           ' ':'z','enter':'z','escape':'x'})[k] || k;
}
function pressed(k){ if(edge[k]){ edge[k]=false; return true; } return false; }

/* ───────────────────────── SOUND EFFECTS ───────────────────────── */
let actx = null, muted = false, sfxBus = null;
function audio(){
  if (actx) return actx;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.25; sfxBus.connect(actx.destination);
  return actx;
}
function beep(freq=440, dur=0.08, type='square', vol=0.4, when=0){
  if (muted) return;
  const a = audio();
  const t = a.currentTime + when;
  const o = a.createOscillator(); const g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t+dur+0.02);
}
addEventListener('keydown', e => {
  if (e.key.toLowerCase()==='m') {
    muted = !muted;
    if (ytReady) try{ muted ? ytPlayer.mute() : ytPlayer.unMute(); }catch(_){}
    flash = 'MUSIC '+(muted?'OFF':'ON'); flashT = 60;
  }
});

/* ───────────────────────── PIXEL HELPERS ───────────────────────── */
function px(x,y,c){ ctx.fillStyle = c; ctx.fillRect(x|0, y|0, 1, 1); }
function rect(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x|0,y|0,w,h); }
function rectO(x,y,w,h,c){ ctx.strokeStyle = c; ctx.lineWidth=1; ctx.strokeRect((x|0)+0.5,(y|0)+0.5,w-1,h-1); }
function circle(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x|0,y|0,r,0,Math.PI*2); ctx.fill(); }

// 3x5 font
const FONT = {
 'A':['010','101','111','101','101'],'B':['110','101','110','101','110'],'C':['011','100','100','100','011'],
 'D':['110','101','101','101','110'],'E':['111','100','110','100','111'],'F':['111','100','110','100','100'],
 'G':['011','100','101','101','011'],'H':['101','101','111','101','101'],'I':['111','010','010','010','111'],
 'J':['001','001','001','101','010'],'K':['101','110','100','110','101'],'L':['100','100','100','100','111'],
 'M':['101','111','111','101','101'],'N':['101','111','111','111','101'],'O':['010','101','101','101','010'],
 'P':['110','101','110','100','100'],'Q':['010','101','101','111','011'],'R':['110','101','110','101','101'],
 'S':['011','100','010','001','110'],'T':['111','010','010','010','010'],'U':['101','101','101','101','011'],
 'V':['101','101','101','101','010'],'W':['101','101','111','111','101'],'X':['101','101','010','101','101'],
 'Y':['101','101','010','010','010'],'Z':['111','001','010','100','111'],
 '0':['010','101','101','101','010'],'1':['010','110','010','010','111'],'2':['110','001','010','100','111'],
 '3':['110','001','010','001','110'],'4':['101','101','111','001','001'],'5':['111','100','110','001','110'],
 '6':['011','100','110','101','010'],'7':['111','001','010','100','100'],'8':['010','101','010','101','010'],
 '9':['010','101','011','001','110'],
 ' ':['000','000','000','000','000'],'!':['010','010','010','000','010'],'?':['110','001','010','000','010'],
 ':':['000','010','000','010','000'],'.':['000','000','000','000','010'],"'":['010','010','000','000','000'],
 '-':['000','000','111','000','000'],',':['000','000','000','010','100'],'/':['001','001','010','100','100'],
};
function text(s, x, y, c='#fff', sc=1){
  s = (s+'').toUpperCase();
  for (let i=0;i<s.length;i++){
    const g = FONT[s[i]] || FONT['?'];
    for (let r=0;r<5;r++) for (let cc=0;cc<3;cc++)
      if (g[r][cc]==='1') rect(x+i*(4*sc)+cc*sc, y+r*sc, sc, sc, c);
  }
}
function textC(s, y, c='#fff', sc=1){ text(s, (W - s.length*4*sc + sc)/2, y, c, sc); }
function textShadow(s, x, y, c, sc=1, shadowC='#000'){
  text(s, x+sc, y+sc, shadowC, sc);
  text(s, x, y, c, sc);
}
function textCShadow(s, y, c, sc=1, shadowC='#000'){
  textShadow(s, (W - s.length*4*sc + sc)/2, y, c, sc, shadowC);
}
function glow(x,y,w,h,c,steps=3){
  for (let i=steps;i>0;i--){
    ctx.fillStyle = c+Math.floor(60/i).toString(16).padStart(2,'0');
    ctx.fillRect(x-i,y-i,w+i*2,h+i*2);
  }
}
function shadow(x,y,w,h,strength=0.35){
  for (let i=0;i<w;i++) for (let j=0;j<h;j++)
    if ((i+j)%2===0) rect(x+i,y+j,1,1,`rgba(0,0,0,${strength})`);
}

/* ───────────────────────── PARTICLES ───────────────────────── */
const PARTS = [];
function spawnPart(x,y,vx,vy,life,c,kind='dot'){
  PARTS.push({x,y,vx,vy,life,maxLife:life,c,kind});
}
function updateParts(){
  for (let i=PARTS.length-1;i>=0;i--){
    const p = PARTS[i];
    p.x += p.vx; p.y += p.vy;
    if (p.kind === 'dust') { p.vy += 0.02; p.vx *= 0.97; }
    if (p.kind === 'spark') { p.vy += 0.08; }
    if (p.kind === 'note') { p.y -= 0.4; }
    if (p.kind === 'confetti') { p.vy += 0.05; p.vx += Math.sin(p.life*0.3)*0.05; }
    p.life--;
    if (p.life<=0) PARTS.splice(i,1);
  }
}
function drawParts(){
  for (const p of PARTS){
    const a = p.life/p.maxLife;
    if (p.kind === 'note'){
      rect(p.x|0, p.y|0, 1, 3, p.c);
      rect((p.x|0)+1, p.y|0, 1, 1, p.c);
      px((p.x|0)-1, (p.y|0)+3, p.c);
    } else if (p.kind === 'confetti'){
      rect(p.x|0, p.y|0, 2, 2, p.c);
    } else if (p.kind === 'dust'){
      const r = a>0.5?2:1;
      rect(p.x|0, p.y|0, r, r, p.c);
    } else {
      px(p.x|0, p.y|0, p.c);
    }
  }
}

/* ───────────────────────── BAND ───────────────────────── */
const BAND = [
  {name:'SULYNN HAGO',     short:'SULYNN', role:'VOCALS/GUITAR', prop:'mic',
   hair:'#2a1408', hair2:'#4a2818', skin:'#f0c8a0', skin2:'#c89870',
   shirt:'#ff2a6d', shirt2:'#a01040', accent:'#ffe0e8', pants:'#1a1a3a',
   longHair:true},
  {name:'JASON WILSON',    short:'JASON', role:'GUITAR', prop:'guitar',
   hair:'#0a0a0a', hair2:'#2a2a2a', skin:'#e8b48a', skin2:'#b88454',
   shirt:'#2a8cff', shirt2:'#0848a8', accent:'#9ed4ff', pants:'#202030',
   shades:true},
  {name:'WILL HOFFMAN',    short:'WILL', role:'BASS', prop:'bass',
   hair:'#c97a2a', hair2:'#8a4a10', skin:'#f0c8a0', skin2:'#c89870',
   shirt:'#2adc8c', shirt2:'#108050', accent:'#9affc8', pants:'#3a2a1a',
   beard:true},
  {name:'ERIC SOMERS-UREA',short:'ERIC',  role:'DRUMS', prop:'drums',
   hair:'#3a1a08', hair2:'#5a2a18', skin:'#f0c8a0', skin2:'#c89870',
   shirt:'#a02aff', shirt2:'#5a0aa0', accent:'#e0a8ff', pants:'#202020',
   hat:true},
];

// === 16-BIT BAND SPRITE — 16 wide × 24 tall, dark outline, 3-shade rendering ===
// Y is the top of the head (the outline above the hair). Feet sit at y+22.
const OUTLINE = '#0a0408';

function drawBandie(b, x, y, dir=0, frame=0){
  const step = ((frame/8)|0) % 4;
  const walking = frame > 0;
  const bob = walking && (step===1||step===3) ? -1 : 0;
  y += bob;

  // Shade swatches (derived from base palette)
  const skLi = blendHex(b.skin, '#fff', 0.25);   // skin highlight
  const skMd = b.skin;                            // skin base
  const skSh = b.skin2;                           // skin shadow
  const shHi = b.accent;                          // shirt highlight
  const shMd = b.shirt;                           // shirt base
  const shSh = b.shirt2;                          // shirt shadow
  const paLi = blendHex(b.pants, '#888', 0.3);   // pants highlight
  const paMd = b.pants;                           // pants base
  const paSh = blendHex(b.pants, '#000', 0.45);  // pants shadow

  // ── SHADOW (under feet) ──
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x-5, y+22, 11, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x-6, y+22, 1, 1);
  ctx.fillRect(x+5, y+22, 1, 1);

  // ── LEGS (with stride and lift) ──
  const stepLift = walking ? (step===1 ? -1 : 0) : 0;  // left foot lift on step 1
  const stepLiftR = walking ? (step===3 ? -1 : 0) : 0; // right foot lift on step 3

  // LEFT LEG
  // outline
  rect(x-4, y+17+stepLift,  1, 5, OUTLINE);     // left edge
  rect(x-1, y+17+stepLift,  1, 5, OUTLINE);     // right edge (between legs)
  rect(x-3, y+22+stepLift,  2, 1, OUTLINE);     // bottom
  // pants fill
  rect(x-3, y+17+stepLift,  2, 4, paMd);
  px(x-3, y+17+stepLift, paLi);                  // highlight pixel
  px(x-3, y+18+stepLift, paLi);
  // boot
  rect(x-3, y+21+stepLift, 2, 1, '#1a0a08');
  px(x-3, y+21+stepLift, '#3a2010');

  // RIGHT LEG
  rect(x+1, y+17+stepLiftR, 1, 5, OUTLINE);
  rect(x+4, y+17+stepLiftR, 1, 5, OUTLINE);
  rect(x+2, y+22+stepLiftR, 2, 1, OUTLINE);
  rect(x+2, y+17+stepLiftR, 2, 4, paMd);
  px(x+2, y+17+stepLiftR, paLi);
  px(x+2, y+18+stepLiftR, paLi);
  rect(x+2, y+21+stepLiftR, 2, 1, '#1a0a08');
  px(x+2, y+21+stepLiftR, '#3a2010');

  // ── TORSO ──
  // outline
  rect(x-5, y+10, 11, 1, OUTLINE);              // top
  rect(x-5, y+17, 11, 1, OUTLINE);              // bottom
  rect(x-5, y+10, 1, 8, OUTLINE);               // left
  rect(x+5, y+10, 1, 8, OUTLINE);               // right
  // fill
  rect(x-4, y+11, 9, 6, shMd);
  // shirt highlights (lit upper-left)
  rect(x-4, y+11, 9, 1, shHi);                  // top edge highlight
  rect(x-4, y+11, 1, 3, shHi);                  // left edge highlight
  px(x-3, y+11, shHi);
  // shadow (right + bottom)
  rect(x+3, y+12, 2, 5, shSh);
  rect(x-4, y+16, 9, 1, shSh);
  // chest seam / placket
  px(x, y+12, shSh); px(x, y+13, shSh); px(x, y+14, shSh); px(x, y+15, shSh);
  // belt
  rect(x-4, y+17, 9, 1, OUTLINE);
  rect(x-3, y+16, 7, 1, '#2a1010');
  rect(x, y+16, 1, 1, '#fcd460');                // belt buckle
  px(x, y+16, '#fceaa0');

  // ── ARMS ──
  const armA = walking ? (step===1 ? 1 : step===3 ? -1 : 0) : 0;
  // LEFT ARM
  rect(x-6, y+11+armA, 1, 5, OUTLINE);          // outer edge outline
  rect(x-5, y+11+armA, 1, 5, shMd);
  px(x-5, y+11+armA, shHi);                      // shoulder highlight
  px(x-5, y+12+armA, shHi);
  // sleeve cuff + hand
  px(x-6, y+15+armA, OUTLINE);
  px(x-5, y+16+armA, OUTLINE);
  px(x-6, y+16+armA, skMd);                      // hand
  // RIGHT ARM
  rect(x+6, y+11-armA, 1, 5, OUTLINE);
  rect(x+5, y+11-armA, 1, 5, shMd);
  px(x+5, y+11-armA, shHi);
  px(x+5, y+12-armA, shHi);
  px(x+6, y+15-armA, OUTLINE);
  px(x+5, y+16-armA, OUTLINE);
  px(x+6, y+16-armA, skMd);

  // ── NECK ──
  rect(x-1, y+8, 3, 2, OUTLINE);                 // outline
  rect(x-1, y+8, 3, 2, skMd);
  rect(x-1, y+9, 3, 1, skSh);                    // neck shadow
  px(x-1, y+8, OUTLINE);                          // re-add corner outlines
  px(x+1, y+8, OUTLINE);

  // ── HEAD (skin base) ──
  // head outline silhouette
  rect(x-3, y+2, 7, 1, OUTLINE);                 // top of forehead
  rect(x-3, y+7, 1, 2, OUTLINE);                 // jaw left
  rect(x+3, y+7, 1, 2, OUTLINE);                 // jaw right
  rect(x-2, y+8, 5, 1, OUTLINE);                 // chin
  // fill
  rect(x-2, y+3, 5, 5, skMd);
  // skin highlights (lit upper-left)
  rect(x-2, y+3, 4, 1, skLi);
  px(x-2, y+4, skLi);
  // skin shadow (right cheek)
  rect(x+2, y+4, 1, 4, skSh);
  // jaw shadow
  rect(x-2, y+7, 5, 1, skSh);
  px(x-2, y+7, skSh);

  // ── HAIR / HEADGEAR ──
  if (dir === 1){
    // back of head
    rect(x-3, y, 7, 1, OUTLINE);
    rect(x-4, y+1, 1, 7, OUTLINE);
    rect(x+4, y+1, 1, 7, OUTLINE);
    rect(x-3, y+1, 7, 7, b.hair);
    if (b.longHair){
      rect(x-4, y+8, 1, 8, OUTLINE);
      rect(x+4, y+8, 1, 8, OUTLINE);
      rect(x-3, y+15, 7, 1, OUTLINE);
      rect(x-3, y+8, 7, 7, b.hair);
    }
  } else if (b.longHair){
    // SULYNN — long flowing dark hair past shoulders with side-parted bangs
    // outline
    rect(x-3, y, 7, 1, OUTLINE);
    rect(x-4, y+1, 1, 11, OUTLINE);              // left side cascade
    rect(x+4, y+1, 1, 11, OUTLINE);              // right side
    rect(x-4, y+12, 9, 1, OUTLINE);              // hair tip across shoulders
    // hair fill
    rect(x-3, y+1, 7, 3, b.hair);                // crown
    rect(x-3, y+1, 1, 11, b.hair);               // left side
    rect(x+3, y+1, 1, 11, b.hair);               // right side
    // bangs
    rect(x-2, y+3, 5, 1, b.hair);
    px(x+1, y+3, skMd);                          // side part gap
    // hair highlights (top + side strands)
    rect(x, y+1, 3, 1, b.hair2);
    px(x-2, y+2, b.hair2);
    px(x-3, y+5, b.hair2);
    px(x+3, y+8, b.hair2);
    px(x-3, y+9, b.hair2);
  } else if (b.shades){
    // JASON — slicked-back rocker hair
    rect(x-3, y+1, 7, 1, OUTLINE);
    rect(x-4, y+2, 1, 2, OUTLINE);
    rect(x+4, y+2, 1, 2, OUTLINE);
    rect(x-3, y+2, 7, 2, b.hair);
    // slick shine
    rect(x-1, y+2, 5, 1, b.hair2);
    px(x+2, y+3, b.hair2);
    // sideburns
    rect(x-3, y+4, 1, 1, b.hair);
    rect(x+3, y+4, 1, 1, b.hair);
  } else if (b.beard){
    // WILL — short hair + full beard
    rect(x-3, y+1, 7, 1, OUTLINE);
    rect(x-4, y+2, 1, 2, OUTLINE);
    rect(x+4, y+2, 1, 2, OUTLINE);
    rect(x-3, y+2, 7, 2, b.hair);
    rect(x-1, y+2, 4, 1, b.hair2);                // hair texture
    // BEARD wraps the lower face
    rect(x-3, y+5, 7, 4, OUTLINE);                // outline around beard
    rect(x-3, y+5, 7, 4, b.hair);
    rect(x-3, y+5, 7, 1, b.hair2);                // mustache highlight strip
    rect(x-2, y+8, 5, 1, '#3a1408');              // beard shadow
    // visible mouth in beard
    px(x, y+6, '#5a1810');
    px(x+1, y+6, '#3a0808');
    // sideburns connect to beard
    rect(x-3, y+4, 1, 1, b.hair);
    rect(x+3, y+4, 1, 1, b.hair);
  } else if (b.hat){
    // ERIC — baseball cap with band logo
    rect(x-3, y, 7, 1, OUTLINE);                   // cap top
    rect(x-4, y+1, 1, 2, OUTLINE);                 // cap left
    rect(x+4, y+1, 1, 2, OUTLINE);                 // cap right
    rect(x-3, y+1, 7, 2, '#1a1a1a');               // cap body
    rect(x-3, y+1, 7, 1, '#3a3a3a');               // cap top band shine
    rect(x-3, y+3, 7, 1, OUTLINE);                 // cap-brim seam
    // brim sticking forward
    rect(x, y+3, 6, 1, OUTLINE);
    rect(x, y+3, 6, 1, '#0a0a0a');
    px(x+5, y+3, OUTLINE);
    // band logo on cap front
    px(x, y+1, '#ff2a6d');
    px(x+1, y+1, '#ff6a8d');
    px(x-1, y+2, '#7a0030');
    // hair peeking out at temples
    px(x-3, y+4, b.hair);
    px(x+3, y+4, b.hair);
  } else {
    // default
    rect(x-3, y+1, 7, 1, OUTLINE);
    rect(x-4, y+2, 1, 2, OUTLINE);
    rect(x+4, y+2, 1, 2, OUTLINE);
    rect(x-3, y+2, 7, 2, b.hair);
    rect(x-1, y+2, 3, 1, b.hair2);
  }

  // ── FACE FEATURES (only when facing camera) ──
  if (dir !== 1){
    if (b.shades){
      // aviator sunglasses
      rect(x-2, y+4, 2, 2, OUTLINE);
      rect(x+1, y+4, 2, 2, OUTLINE);
      // lens depth
      px(x-2, y+5, '#1a3a5a');
      px(x-1, y+5, '#0a1828');
      px(x+1, y+5, '#1a3a5a');
      px(x+2, y+5, '#0a1828');
      // shiny glint
      px(x-2, y+4, '#bce8ff');
      px(x+1, y+4, '#bce8ff');
      // bridge
      px(x, y+4, OUTLINE);
    } else {
      // eyebrows (slim)
      rect(x-2, y+3, 2, 1, b.hair);
      rect(x+1, y+3, 2, 1, b.hair);
      // eye whites
      rect(x-2, y+4, 2, 1, '#fff8e8');
      rect(x+1, y+4, 2, 1, '#fff8e8');
      // pupils (dark, looking forward)
      px(x-1, y+4, OUTLINE);
      px(x+2, y+4, OUTLINE);
      // eye highlight
      px(x-2, y+4, '#fff');
      px(x+1, y+4, '#fff');
    }
    // nose shadow
    px(x, y+5, skSh);
    px(x+1, y+6, skSh);
    // mouth (skip if beard)
    if (!b.beard){
      rect(x-1, y+7, 3, 1, '#5a1a20');
      px(x, y+7, '#3a0810');
      if (b.longHair){
        // Sulynn — pink lipstick
        px(x-1, y+7, '#c83048');
        px(x+1, y+7, '#c83048');
        px(x, y+7, '#9a1020');
      }
    }
  }

  // ── INSTRUMENT PROP (player carries it while exploring) ──
  if (b.prop && walking && dir !== 1){
    drawCarriedInstrument(b.prop, x, y, armA);
  }
}

// Player carries their instrument visibly in their right hand while walking
function drawCarriedInstrument(prop, x, y, armA){
  const hy = y + 16 - armA;     // right hand position
  if (prop === 'mic'){
    rect(x+6, hy-3, 1, 4, OUTLINE);
    rect(x+5, hy-4, 3, 2, '#444');
    rect(x+5, hy-4, 3, 1, '#888');
    px(x+6, hy-4, '#aaa');
  } else if (prop === 'guitar'){
    // Telecaster slung over shoulder
    rect(x+5, hy-1, 8, 4, OUTLINE);
    rect(x+6, hy, 7, 3, '#e8a020');
    rect(x+6, hy, 7, 1, '#ffd060');
    px(x+10, hy+1, '#1a1a1a');     // pickup
    // neck pointing forward
    rect(x+12, hy, 4, 1, '#8a5a2a');
  } else if (prop === 'bass'){
    rect(x+5, hy-1, 9, 4, OUTLINE);
    rect(x+6, hy, 8, 3, '#5a2a8a');
    rect(x+6, hy, 8, 1, '#8a4aaa');
    px(x+11, hy+1, '#fff');
    rect(x+13, hy, 4, 1, '#8a5a2a');
  } else if (prop === 'drums'){
    // drumsticks
    rect(x+6, hy-3, 1, 4, '#a87040');
    px(x+6, hy-3, '#d8a070');
  }
}

// Stage version: each member with their actual instrument prop
function drawBandieStage(b, x, y, frame=0){

/* ─── VINTAGE PICKUP TRUCK (1965 Ford F-100 style) ─── */
// Profile: low bed in back, tall cab in middle, low hood in front.
// Animals ride in the open bed (no wagon).
function drawTruckSide(x, y, dir, frame, headlightsOn=false, animals=[]){
  const flip = (dir === 2);
  ctx.save();
  if (flip){ ctx.translate(x*2, 0); ctx.scale(-1, 1); }

  // === DROP SHADOW ===
  shadow(x-15, y+10, 32, 3, 0.45);

  // === REAR BUMPER (chrome) ===
  rect(x-15, y+3, 3, 2, '#d8d8d8');
  rect(x-15, y+3, 3, 1, '#fff8f0');
  px(x-15, y+4, '#7a7a7a');

  // === TAILLIGHTS ===
  rect(x-13, y, 1, 3, '#ff2020');
  px(x-13, y, '#ff8080');
  px(x-13, y+2, '#a00010');

  // === BED (low, behind cab) ===
  // bed sidewall (red)
  rect(x-13, y-2, 8, 6, '#c8000a');
  rect(x-13, y-2, 8, 1, '#ff4a2a');          // top highlight
  rect(x-13, y+3, 8, 1, '#7a0008');          // bottom shadow
  // bed top rail (front rim)
  rect(x-13, y-3, 9, 1, '#ff4a2a');
  px(x-5, y-3, '#c8000a');                   // rail transition to cab
  // tailgate seam (vertical line near back)
  rect(x-12, y-2, 1, 6, '#a00008');
  // looking down into bed: wood floor visible
  rect(x-12, y-3, 8, 1, '#3a200a');
  for (let i=0; i<4; i++) px(x-11+i*2, y-3, '#5a3010');
  // gas cap on bed side
  rect(x-9, y+1, 2, 1, '#888');
  px(x-9, y+1, '#c8c8c8');
  // body trim line at base
  rect(x-13, y+2, 8, 1, '#a00008');

  // === ANIMALS RIDING IN BED ===
  for (let i=0; i<animals.length; i++){
    const sx = x - 12 + (i%3)*3;
    const bobOffset = ((frame+i*7)%30 < 15) ? 0 : -1;
    const sy = y - 5 - (((i/3)|0))*3 + bobOffset;
    drawMiniAnimal(animals[i], sx, sy);
  }

  // === CAB BACK POST (between bed and cab) ===
  rect(x-5, y-7, 1, 11, '#7a0008');

  // === CAB ROOF (clearly taller than bed/hood) ===
  rect(x-3, y-9, 7, 1, '#a00008');           // very top edge
  rect(x-4, y-8, 9, 1, '#c8000a');           // roof
  rect(x-4, y-7, 9, 1, '#ff4a2a');           // roof highlight stripe

  // === CAB SIDE BODY ===
  rect(x-4, y-6, 1, 10, '#a00008');          // back edge of cab
  rect(x-4, y-2, 9, 6, '#c8000a');           // cab side panel below window
  rect(x-4, y-2, 9, 1, '#a00008');           // shadow under window
  rect(x-4, y+3, 9, 1, '#7a0008');           // bottom shadow

  // === SIDE WINDOW (square, behind windshield) ===
  rect(x-3, y-6, 4, 4, '#0a1828');           // glass dark
  rect(x-3, y-6, 4, 1, '#5a8ac0');           // sky reflection top
  rect(x-3, y-5, 4, 1, '#7aaae0');           // brighter
  rect(x-2, y-4, 3, 1, '#3a5a8a');
  px(x-2, y-5, '#bce8ff');                   // glint
  // window frame (top + chrome trim)
  rect(x-3, y-6, 1, 4, '#7a0008');
  px(x-3, y-7, '#a00008');
  px(x+1, y-7, '#a00008');

  // === WINDSHIELD (slanted forward) ===
  // top edge (just under roof front)
  rect(x+1, y-7, 4, 1, '#a00008');
  rect(x+1, y-6, 4, 1, '#0a1828');
  // glass body — slanted, getting wider going down
  rect(x+1, y-5, 5, 1, '#1a2030');
  rect(x+1, y-5, 5, 1, '#5a8ac0');           // reflection
  rect(x, y-4, 6, 1, '#1a2030');
  rect(x, y-4, 6, 1, '#7aaae0');             // bright reflection
  rect(x-1, y-3, 7, 1, '#3a5a8a');           // bottom edge
  // glint on windshield
  rect(x+2, y-5, 2, 1, '#bce8ff');
  px(x+3, y-4, '#dcf8ff');

  // === SIDE MIRROR ===
  rect(x+5, y-5, 1, 1, '#7a0008');           // mirror arm
  rect(x+6, y-6, 1, 2, '#888');              // housing
  px(x+6, y-5, '#3a3a3a');

  // === DOOR DETAILS ===
  // door seam (vertical line on cab door)
  rect(x, y-1, 1, 5, '#a00008');
  // door handle
  rect(x+2, y, 2, 1, '#d8d8d8');
  px(x+3, y, '#fff8f0');
  // body line / character crease
  rect(x-4, y+1, 9, 1, '#a00008');

  // === HOOD (low, in front of cab) ===
  rect(x+5, y-2, 8, 6, '#c8000a');           // hood body
  rect(x+5, y-2, 8, 1, '#ff4a2a');           // hood top highlight
  rect(x+5, y-1, 8, 1, '#d62828');
  rect(x+5, y+3, 8, 1, '#7a0008');           // hood bottom shadow
  // hood center ridge
  rect(x+8, y-2, 1, 5, '#a00008');
  px(x+8, y-3, '#d8d8d8');                   // hood ornament tip
  // chrome strip down center
  px(x+9, y-2, '#e0e0e0');
  // hood side louvers
  rect(x+5, y+1, 4, 1, '#a00008');
  px(x+6, y+1, '#7a0008');

  // === HEADLIGHT (round sealed-beam) ===
  if (headlightsOn){
    ctx.fillStyle = 'rgba(255,240,180,0.18)';
    ctx.beginPath();
    ctx.moveTo(x+13, y-2); ctx.lineTo(x+44, y-12); ctx.lineTo(x+44, y+10); ctx.lineTo(x+13, y+2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,0.30)';
    ctx.beginPath();
    ctx.moveTo(x+13, y-2); ctx.lineTo(x+30, y-7); ctx.lineTo(x+30, y+5); ctx.lineTo(x+13, y+2); ctx.fill();
    rect(x+12, y-2, 2, 3, '#fff8b0');
    px(x+13, y-1, '#ffffff');
    px(x+13, y, '#fff8c0');
  } else {
    rect(x+12, y-2, 2, 3, '#ffd966');
    px(x+12, y-2, '#fff8a0');
    px(x+13, y, '#a07810');
  }
  // chrome bezel around headlight
  rect(x+11, y-2, 1, 3, '#a8a8a8');
  px(x+11, y-3, '#d8d8d8');
  px(x+14, y-2, '#888');

  // === GRILLE (chrome bars at front) ===
  rect(x+13, y+1, 1, 2, '#1a1a1a');
  px(x+13, y+1, '#a8a8a8');
  px(x+13, y+3, '#a8a8a8');

  // === FRONT BUMPER (chrome) ===
  rect(x+12, y+4, 3, 2, '#d8d8d8');
  rect(x+12, y+4, 3, 1, '#fff8f0');
  px(x+14, y+5, '#5a5a5a');

  // === WHEEL WELLS (curved arches above wheels) ===
  // rear arch
  rect(x-11, y+4, 6, 1, '#5a0004');
  px(x-12, y+4, '#7a0008'); px(x-5, y+4, '#7a0008');
  px(x-11, y+3, '#5a0004'); px(x-6, y+3, '#5a0004');
  // front arch
  rect(x+5, y+4, 6, 1, '#5a0004');
  px(x+4, y+4, '#7a0008'); px(x+11, y+4, '#7a0008');
  px(x+5, y+3, '#5a0004'); px(x+10, y+3, '#5a0004');

  // === WHEELS ===
  const spin = (frame/3)|0;
  drawWheel(x-8, y+6, spin);
  drawWheel(x+8, y+6, spin);

  ctx.restore();
}

function drawWheel(x, y, spin){
  // tire (rounded with shading)
  rect(x-2, y, 5, 4, '#0a0a0a');
  rect(x-2, y, 5, 1, '#2a2a2a');             // top highlight
  px(x-2, y, '#0a0a0a');
  px(x+2, y, '#0a0a0a');
  px(x-2, y+3, '#0a0a0a');
  px(x+2, y+3, '#0a0a0a');
  // hubcap
  rect(x-1, y+1, 3, 2, '#a8a8a8');
  px(x-1, y+1, '#d8d8d8');                   // hub highlight
  px(x+1, y+2, '#5a5a5a');                   // hub shadow
  // spinning spoke pattern
  const p = spin % 4;
  if (p===0){ px(x, y+1, '#fff'); }
  else if (p===1){ px(x+1, y+1, '#fff'); }
  else if (p===2){ px(x, y+2, '#fff'); }
  else { px(x-1, y+1, '#fff'); }
}

// wagon flag kept in signature for back-compat but no longer drawn.
function drawTruck(x, y, dir=3, _wagon=true, animals=[], frame=0, headlights=false){
  if (dir === 2 || dir === 3){
    drawTruckSide(x, y, dir, frame, headlights, animals);
  } else {
    drawTruckTopBottom(x, y, dir, frame, animals);
  }
}

function drawTruckTopBottom(x, y, dir, frame, animals){
  shadow(x-10, y+11, 20, 3, 0.4);
  // ── BED (back half — larger rectangle with wood floor) ──
  rect(x-9, y-1, 18, 11, '#a00008');         // bed sides
  rect(x-9, y-1, 18, 1, '#c8000a');
  rect(x-9, y+9, 18, 1, '#5a0004');
  rect(x-7, y, 14, 9, '#3a200a');            // wood floor
  for (let i=0; i<4; i++) rect(x-7, y+1+i*2, 14, 1, '#5a3010');
  // bed top rail
  rect(x-9, y-1, 18, 1, '#ff4a2a');

  // ── CAB (smaller rectangle, in front half) ──
  rect(x-8, y-9, 16, 8, '#c8000a');
  rect(x-8, y-9, 16, 1, '#ff4a2a');
  rect(x-8, y-2, 16, 1, '#7a0008');
  // windshield/roof window from above
  rect(x-6, y-8, 12, 6, '#1a2030');
  rect(x-6, y-8, 12, 1, '#5a8ac0');
  rect(x-6, y-7, 12, 1, '#7aaae0');
  px(x-4, y-7, '#bce8ff');
  px(x+2, y-6, '#dcf8ff');
  // cab roof framing
  rect(x-6, y-8, 1, 6, '#a00008');
  rect(x+5, y-8, 1, 6, '#a00008');

  // ── HOOD ornament (front) ──
  if (dir === 1){
    // facing UP — headlights at top
    rect(x-7, y-10, 2, 1, '#ffd966');
    rect(x+5, y-10, 2, 1, '#ffd966');
    px(x-7, y-10, '#fff8b0');
    px(x+5, y-10, '#fff8b0');
    // grille
    rect(x-4, y-10, 8, 1, '#3a3a3a');
  } else {
    // facing DOWN — taillights at bottom
    rect(x-7, y+10, 2, 1, '#ff2020');
    rect(x+5, y+10, 2, 1, '#ff2020');
    px(x-7, y+10, '#ff8080');
    px(x+5, y+10, '#ff8080');
  }

  // ── 4 WHEELS ──
  rect(x-9, y-7, 2, 4, '#1a1a1a');
  rect(x+7, y-7, 2, 4, '#1a1a1a');
  rect(x-9, y+3, 2, 4, '#1a1a1a');
  rect(x+7, y+3, 2, 4, '#1a1a1a');
  // hubcap dots
  px(x-9, y-5, '#888'); px(x+8, y-5, '#888');
  px(x-9, y+5, '#888'); px(x+8, y+5, '#888');

  // ── ANIMALS IN BED ──
  for (let i=0; i<animals.length; i++){
    const sx = x - 6 + (i%3)*4;
    const sy = y + 2 + ((i/3)|0)*3;
    drawMiniAnimal(animals[i], sx, sy);
  }
}
function drawMiniAnimal(a, x, y){
  const A = ANIMALS[a];
  const c = A.color, c2 = A.color2 || '#000';
  rect(x-1, y, 4, 3, c);
  rect(x-1, y, 4, 1, A.color3 || c); // highlight
  px(x-1, y-1, c); px(x+2, y-1, c); // ears
  px(x, y+1, c2); px(x+1, y+1, c2); // eyes
}

/* ───────────────────────── ANIMALS (BIGGER, BETTER) ───────────────────────── */
// === 16-BIT ANIMAL SPRITES — outlined, 3-shade, anatomically detailed ===
// Each sprite has a 1px dark outline around its silhouette and proper shading.
function drawAlligator(x,y,frame=0){
  const open = (frame%60 < 10) ? 1 : 0;
  const OUT = '#06140a';
  const D = '#1a4a1a';     // gator dark
  const M = '#3a8b3a';     // gator base
  const L = '#5aab5a';     // gator highlight
  const B = '#7acb6a';     // bright

  // ── SHADOW ──
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x-15, y+12, 30, 1);

  // ── TAIL (curving to the left) ──
  rect(x-18, y+8, 2, 1, OUT);                       // tail tip outline
  rect(x-17, y+7, 1, 3, OUT);
  rect(x-16, y+6, 1, 4, OUT);
  rect(x-15, y+5, 1, 5, OUT);
  rect(x-14, y+5, 12, 1, OUT);                      // tail top outline
  rect(x-14, y+9, 12, 1, OUT);                      // tail bottom outline
  rect(x-17, y+8, 1, 1, M);                         // tail tip
  rect(x-15, y+7, 1, 2, M);
  rect(x-14, y+6, 12, 3, M);                        // tail body
  rect(x-14, y+6, 12, 1, L);                        // tail top highlight
  rect(x-14, y+8, 12, 1, D);                        // tail bottom shadow

  // ── BODY ──
  rect(x-9, y+2, 16, 1, OUT);                       // back outline
  rect(x-9, y+9, 16, 1, OUT);                       // belly outline
  rect(x-10, y+3, 1, 6, OUT);                       // back-left
  rect(x+7, y+3, 1, 6, OUT);                        // back-right (joins snout)
  rect(x-9, y+3, 16, 6, M);                         // body fill
  rect(x-9, y+3, 16, 1, L);                         // back highlight
  rect(x-9, y+8, 16, 1, D);                         // belly shadow
  rect(x-9, y+7, 16, 1, '#2a6a2a');                 // mid shadow band
  // belly scales (lighter dots in a row)
  for (let i=0; i<5; i++) px(x-7+i*4, y+8, M);

  // ── BACK SCUTES (armored ridges) ──
  for (let i=0; i<8; i++){
    const sx = x-7+i*2;
    px(sx, y+1, OUT);
    px(sx, y+2, D);
  }
  px(x-7, y+2, B); px(x-3, y+2, B); px(x+1, y+2, B); px(x+5, y+2, B);

  // ── SNOUT (long, with teeth when open) ──
  rect(x+8, y+3, 7, 1, OUT);                        // snout top
  rect(x+8, y+7+open, 7, 1, OUT);                   // snout bottom
  rect(x+15, y+4, 1, 3+open, OUT);                  // snout tip
  rect(x+8, y+4, 7, 3+open, M);                     // snout fill
  rect(x+8, y+4, 7, 1, L);                          // top highlight
  rect(x+8, y+6+open, 7, 1, D);                     // bottom shadow
  // nostrils on top
  px(x+13, y+4, OUT);
  px(x+14, y+4, OUT);
  // teeth when open
  if (open){
    rect(x+8, y+6, 7, 1, '#1a3a1a');                // mouth interior
    for (let i=0; i<4; i++) px(x+9+i*2, y+5, '#fff');
    for (let i=0; i<3; i++) px(x+10+i*2, y+7, '#fff');
  } else {

  // ── EYE (raised, yellow with vertical pupil) ──

  rect(x+6, y+1, 1, 2, OUT);
  rect(x+5, y+1, 1, 2, '#ffd966');                  // yellow sclera
  px(x+5, y+1, '#fff8a0');                          // glint
  px(x+5, y+2, OUT);                                // vertical pupil slit

  // ── LEGS (with claws) ──

  rect(x+10, y+2, 1, 4, D);                         // tail ring 2

  rect(x-5, y+11, 12, 1, OUT);                      // belly outline

  rect(x+7, y+3, 1, 8, OUT);                        // body right

  rect(x-5, y+3, 12, 1, L);                         // back highlight
  rect(x-5, y+10, 12, 1, D);                        // belly shadow

function drawPelican(x,y,frame=0){
  const blink = (frame%80 < 4) ? 1 : 0;
  const OUT = '#0a0a0a';
  const D = '#a8a8a8';
  const M = '#e8e8e8';
  const L = '#fff';
  const BD = '#a06000';   // bill dark
  const BM = '#e8a020';   // bill base
  const BL = '#ffc040';   // bill light

  // ── SHADOW ──
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x-7, y+15, 16, 1);

  // ── BODY ──
  rect(x-5, y+2, 11, 1, OUT);
  rect(x-5, y+10, 11, 1, OUT);
  rect(x-6, y+3, 1, 7, OUT);
  rect(x+6, y+3, 1, 7, OUT);
  rect(x-5, y+3, 11, 7, M);
  rect(x-5, y+3, 11, 1, L);                         // back highlight
  rect(x-5, y+9, 11, 1, D);                         // belly shadow

  // ── WING (folded along side) ──
  rect(x-8, y+3, 1, 5, OUT);
  rect(x-7, y+3, 1, 1, OUT);
  rect(x-7, y+8, 1, 1, OUT);
  rect(x-7, y+4, 1, 4, M);
  px(x-7, y+4, L);
  px(x-7, y+7, D);
  // wing feather lines
  px(x-6, y+5, D); px(x-6, y+7, D);
  px(x-6, y+8, OUT);                                // wing tip

  // ── NECK + HEAD ──
  rect(x+3, y-3, 5, 1, OUT);                        // head top
  rect(x+2, y-2, 1, 5, OUT);                        // head left
  rect(x+8, y-2, 1, 4, OUT);                        // head right
  rect(x+3, y+2, 2, 1, OUT);                        // chin
  rect(x+3, y-2, 5, 5, M);                          // head fill
  rect(x+3, y-2, 5, 1, L);                          // crown highlight
  // eye
  if (!blink){
    rect(x+5, y-1, 2, 1, '#fff');
    px(x+6, y-1, OUT);                              // pupil
  } else {
    rect(x+5, y-1, 2, 1, OUT);
  }
  // brow
  px(x+5, y-2, '#888');

  // ── BILL (long, with pouch) ──
  rect(x+8, y+1, 8, 1, OUT);                        // bill top edge
  rect(x+8, y+6, 8, 1, OUT);                        // bill bottom edge
  rect(x+15, y+2, 1, 4, OUT);                       // bill tip
  rect(x+8, y+2, 7, 1, BL);                         // top of bill
  rect(x+8, y+3, 7, 1, BM);                         // mid bill
  rect(x+8, y+4, 7, 2, BD);                         // pouch (darker)
  // hook at tip
  px(x+14, y+2, '#fff8d0');
  // mouth line
  rect(x+8, y+3, 7, 1, BM);
  px(x+9, y+5, OUT);

  // ── LEGS (orange/webbed) ──
  rect(x-3, y+11, 1, 3, OUT);
  rect(x+1, y+11, 1, 3, OUT);
  rect(x-3, y+11, 1, 3, BM);
  rect(x+1, y+11, 1, 3, BM);
  // webbed feet
  rect(x-4, y+14, 3, 1, OUT);
  rect(x+0, y+14, 3, 1, OUT);
  rect(x-4, y+14, 3, 1, BD);
  rect(x+0, y+14, 3, 1, BD);
}

function drawLonghorn(x,y,frame=0){
  const OUT = '#1a0a05';
  const D = '#5a3a1a';
  const M = '#8b5a2b';
  const L = '#b88450';
  const HD = '#a09050';     // horn shadow
  const HM = '#e0d090';     // horn mid
  const HL = '#fff8d0';     // horn highlight

  // ── SHADOW ──
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x-9, y+14, 20, 1);

  // ── TAIL ──
  rect(x-11, y+4, 1, 5, OUT);
  rect(x-10, y+8, 1, 1, OUT);
  rect(x-11, y+9, 2, 1, OUT);
  rect(x-10, y+4, 1, 4, D);
  px(x-10, y+8, '#1a0a05');                         // tail tuft

  // ── BODY ──
  rect(x-9, y+2, 16, 1, OUT);
  rect(x-9, y+10, 16, 1, OUT);
  rect(x-10, y+3, 1, 7, OUT);
  rect(x+7, y+3, 1, 7, OUT);
  rect(x-9, y+3, 16, 7, M);
  rect(x-9, y+3, 16, 1, L);                         // top highlight
  rect(x-9, y+9, 16, 1, D);                         // belly shadow
  // hide spots (white markings)
  rect(x-6, y+5, 3, 2, L);
  rect(x+2, y+6, 2, 2, L);
  px(x-1, y+8, L);

  // ── HEAD ──
  rect(x+5, y-1, 5, 1, OUT);
  rect(x+5, y+6, 5, 1, OUT);
  rect(x+4, y, 1, 6, OUT);
  rect(x+10, y, 1, 6, OUT);
  rect(x+5, y, 5, 6, M);
  rect(x+5, y, 5, 1, L);                            // forehead highlight
  rect(x+5, y+5, 5, 1, D);                          // chin shadow
  // hide blaze (white forehead stripe)
  rect(x+7, y, 1, 4, L);

  // ── MASSIVE HORNS (sweeping outward) ──
  // left horn (going left)
  rect(x-3, y-3, 1, 1, OUT);                        // tip
  rect(x-2, y-3, 7, 1, OUT);                        // top edge
  rect(x-2, y-2, 7, 1, HL);                         // highlight top
  rect(x-2, y-1, 7, 1, HM);                         // mid
  rect(x-2, y, 7, 1, OUT);                          // bottom edge
  rect(x-3, y-2, 1, 2, HM);                         // sharp tip
  // right horn (going right)
  rect(x+16, y-3, 1, 1, OUT);                       // tip
  rect(x+10, y-3, 6, 1, OUT);                       // top edge
  rect(x+10, y-2, 6, 1, HL);                        // highlight
  rect(x+10, y-1, 6, 1, HM);                        // mid
  rect(x+10, y, 6, 1, OUT);                         // bottom edge
  rect(x+16, y-2, 1, 2, HM);                        // sharp tip

  // ── EYE ──
  rect(x+7, y+2, 2, 1, OUT);
  px(x+7, y+2, '#fff');
  px(x+8, y+2, OUT);

  // ── NOSE / MUZZLE ──
  rect(x+8, y+4, 2, 1, OUT);
  px(x+8, y+4, '#1a1a1a');
  px(x+9, y+4, '#3a3a3a');
  // nostril
  px(x+9, y+5, OUT);

  // ── LEGS (four with hooves) ──
  for (let i=0; i<4; i++){
    const lx = x-6+i*4;
    rect(lx, y+11, 1, 3, OUT);
    rect(lx+1, y+11, 1, 3, OUT);
    rect(lx, y+11, 2, 3, D);
    rect(lx, y+13, 2, 1, '#0a0a0a');                // hoof
  }
}

function drawBighorn(x,y,frame=0){
  const OUT = '#1a0808';
  const D = '#7a6850';                              // wool shadow
  const M = '#c8b890';                              // wool base
  const L = '#f0e0c0';                              // wool highlight
  const HD = '#3a2010';                             // horn shadow
  const HM = '#6a4a2a';                             // horn mid
  const HL = '#8a6838';                             // horn highlight

  // ── SHADOW ──
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x-8, y+14, 18, 1);

  // ── WOOLLY BODY ──
  rect(x-7, y+2, 14, 1, OUT);                       // back (bumpy outline)
  for (let i=0; i<6; i++) px(x-6+i*3, y+1, OUT);    // wool tufts up top
  rect(x-7, y+10, 14, 1, OUT);                      // belly outline
  rect(x-8, y+3, 1, 7, OUT);
  rect(x+7, y+3, 1, 7, OUT);
  rect(x-7, y+3, 14, 7, M);                         // body fill
  rect(x-7, y+3, 14, 1, L);                         // back highlight
  rect(x-7, y+9, 14, 1, D);                         // belly shadow
  // wool curls (alternating dither pattern)
  for (let i=0; i<7; i++){
    px(x-6+i*2, y+5, L);
    px(x-5+i*2, y+6, D);
    px(x-6+i*2, y+7, L);
    px(x-5+i*2, y+8, D);
  }

  // ── HEAD ──
  rect(x+4, y+1, 5, 1, OUT);
  rect(x+4, y+7, 5, 1, OUT);
  rect(x+3, y+2, 1, 5, OUT);
  rect(x+9, y+2, 1, 5, OUT);
  rect(x+4, y+2, 5, 5, '#a89070');                  // skin/face
  rect(x+4, y+2, 5, 1, '#c8b090');                  // forehead
  rect(x+4, y+6, 5, 1, '#7a6050');                  // chin shadow

  // ── MASSIVE CURLED HORNS (front-facing) ──
  // outline of horn curl on each side
  rect(x+1, y-2, 4, 1, OUT);
  rect(x, y-1, 1, 3, OUT);
  rect(x+5, y-2, 4, 1, OUT);
  rect(x+9, y-1, 1, 3, OUT);
  // horn fill
  rect(x+1, y-1, 4, 1, HL);                         // top of left curl
  rect(x+1, y, 1, 2, HM);                           // left curl front
  rect(x+5, y-1, 4, 1, HL);                         // top of right curl
  rect(x+9, y, 1, 2, HM);                           // right curl front
  rect(x+2, y+1, 3, 1, HM);                         // horn meeting head
  rect(x+5, y+1, 3, 1, HM);
  // horn segment ridges (3 per horn)
  px(x+1, y, HL); px(x+3, y, HL); px(x+5, y, HL); px(x+7, y, HL);
  // shadow inside curl
  px(x+2, y, HD); px(x+7, y, HD);

  // ── EYE ──
  rect(x+5, y+3, 2, 1, OUT);
  px(x+5, y+3, '#fff');
  px(x+6, y+3, OUT);

  // ── NOSE / MUZZLE ──
  rect(x+6, y+5, 2, 1, OUT);
  px(x+7, y+5, '#1a1a1a');

  // ── LEGS ──
  for (let i=0; i<4; i++){
    const lx = x-5+i*4;
    rect(lx, y+11, 1, 3, OUT);
    rect(lx+1, y+11, 1, 3, OUT);
    rect(lx, y+11, 2, 3, '#6a5040');
    rect(lx, y+13, 2, 1, OUT);                      // hoof
  }
}

/* ─── Polygon helpers ─── */
function pointInPoly(x, y, poly){
  let inside = false;
  for (let i=0,j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1) + xi)) inside = !inside;
  }
  return inside;
}
function fillPoly(cx, poly, color){
  cx.fillStyle = color;
  let yMin=Infinity, yMax=-Infinity;
  for (const p of poly){ if(p[1]<yMin) yMin=p[1]; if(p[1]>yMax) yMax=p[1]; }
  for (let y=yMin; y<=yMax; y++){
    const xs=[];
    for (let i=0,j=poly.length-1; i<poly.length; j=i++){
      const y1=poly[i][1], y2=poly[j][1];
      if ((y1<=y && y2>y) || (y2<=y && y1>y)){
        const x = poly[i][0] + (y - y1)*(poly[j][0]-poly[i][0])/(y2-y1);
        xs.push(x);
      }
    }
    xs.sort((a,b)=>a-b);
    for (let i=0; i<xs.length-1; i+=2){
      const a=Math.ceil(xs[i]), b=Math.floor(xs[i+1]);
      if (b>=a) cx.fillRect(a, y, b-a+1, 1);
    }
  }
}

/* ─── 2-D ordered Bayer-style dither (size 4x4) for soft biome edges ─── */
function dither4(x, y, t){
  // returns true if pixel should be highlight, given threshold t (0..15)
  const M = [
     0, 8, 2,10,
    12, 4,14, 6,
     3,11, 1, 9,
    15, 7,13, 5
  ];
  return M[(y&3)*4 + (x&3)] < t;
}
function noise2(x, y){
  // deterministic pseudo-noise 0..15
  return ((x*73 + y*131 + x*y*5) % 16 + 16) % 16;
}

/* ─── Pre-render the static map to an offscreen canvas ─── */
let mapBaked = null, landMask = null;
function bakeMap(){
  if (mapBaked) return;
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const ocx = oc.getContext('2d');
  ocx.imageSmoothingEnabled = false;
  const P = (x,y,c) => { ocx.fillStyle=c; ocx.fillRect(x,y,1,1); };

  // ── BUILD LAND MASK (one-shot, all subsequent ops are O(1) lookups) ──
  landMask = new Uint8Array(W*H);
  for (let y=35; y<H; y++){
    for (let x=0; x<W; x++){
      if (pointInPoly(x, y, US_POLY)) landMask[y*W+x] = 1;
    }
  }
  const isL = (x,y) => x>=0 && x<W && y>=0 && y<H && landMask[y*W+x]===1;

  // ── DEEP OCEAN with bathymetric gradient ──
  for (let y=35; y<H; y++){
    const t = (y-35)/(H-35);
    const r = (0x0e + (0x1a-0x0e)*t)|0;
    const g = (0x2a + (0x42-0x2a)*t)|0;
    const b = (0x5a + (0x80-0x5a)*t)|0;
    ocx.fillStyle = `rgb(${r},${g},${b})`;
    ocx.fillRect(0, y, W, 1);
  }
  // ocean texture — subtle horizontal striation
  for (let y=37; y<H; y+=3){
    for (let x=0; x<W; x++){
      if (isL(x,y)) continue;
      const n = noise2(x, y);
      if (n < 3) P(x, y, 'rgba(90,150,210,0.15)');
      else if (n < 5) P(x, y, 'rgba(20,40,80,0.18)');
    }
  }
  // foam line near top
  for (let x=0; x<W; x+=1){
    if (noise2(x, 35) > 12) P(x, 35, PAL.foam);
    if (noise2(x, 36) > 13) P(x, 36, '#7aaad8');
  }

  // ── COASTAL SHALLOW WATER GLOW ──
  for (let y=36; y<H; y++){
    for (let x=0; x<W; x++){
      if (isL(x,y)) continue;
      let near = 0;
      for (let r=1; r<=4; r++){
        if (isL(x+r,y) || isL(x-r,y) || isL(x,y+r) || isL(x,y-r) ||
            isL(x+r,y+r) || isL(x-r,y-r)){
          near = r; break;
        }
      }
      if (near === 1) P(x, y, PAL.foam);
      else if (near === 2) P(x, y, '#3a78bc');
      else if (near === 3) P(x, y, '#2868a8');
      else if (near === 4 && noise2(x,y)>9) P(x, y, '#1e5298');
    }
  }

  // ── LAND BASE ──
  fillPoly(ocx, US_POLY, PAL.grass2);

  // ── BIOME PAINT (uses precomputed mask) ──
  for (let y=44; y<206; y++){
    for (let x=28; x<295; x++){
      if (!isL(x,y)) continue;
      const c = paintBiome(x, y, noise2(x,y));
      if (c) P(x, y, c);
    }
  }

  // ── COASTLINE OUTLINE ──
  for (let y=36; y<H-2; y++){
    for (let x=2; x<W-2; x++){
      if (!isL(x,y)) continue;
      if (!isL(x-1,y) || !isL(x+1,y) || !isL(x,y-1) || !isL(x,y+1)){
        P(x, y, PAL.coastDark);
      }
    }
  }
  // Inner beach (1px sand strip just inland from coast)
  for (let y=36; y<H-2; y++){
    for (let x=2; x<W-2; x++){
      if (!isL(x,y)) continue;
      const isCoast = !isL(x-1,y) || !isL(x+1,y) || !isL(x,y-1) || !isL(x,y+1);
      if (isCoast) continue;
      const nearCoast = !isL(x-2,y) || !isL(x+2,y) || !isL(x,y-2) || !isL(x,y+2);
      if (nearCoast && (noise2(x,y) > 6)) P(x, y, PAL.sandLite);
    }
  }

  // ── BAYS (cut water shapes into land) ──
  for (const bay of BAYS){
    fillPoly(ocx, bay, PAL.mid);
    // inner shimmer
    for (let i=0; i<bay.length; i++){
      const a = bay[i], b = bay[(i+1)%bay.length];
      strokePath(ocx, a, b, PAL.shal);
    }
  }

  // ── GREAT LAKES ──
  for (const lake of GREAT_LAKES){
    fillPoly(ocx, lake, PAL.deep);
    // shore highlight
    for (let i=0; i<lake.length; i++){
      const a = lake[i], b = lake[(i+1)%lake.length];
      strokePath(ocx, a, b, PAL.shal);
    }
    // surface shimmer
    let yMin=999,yMax=0,xMin=999,xMax=0;
    for (const p of lake){
      if(p[1]<yMin)yMin=p[1];if(p[1]>yMax)yMax=p[1];
      if(p[0]<xMin)xMin=p[0];if(p[0]>xMax)xMax=p[0];
    }
    for (let y=yMin+1;y<yMax;y++) for(let x=xMin+1;x<xMax;x++){
      if (pointInPoly(x,y,lake) && noise2(x,y)===5) P(x,y,PAL.foam);
    }
  }

  // ── RIVERS ──
  for (const name in RIVERS){
    const r = RIVERS[name];
    for (let i=0; i<r.length-1; i++){
      const a = r[i], b = r[i+1];
      const steps = Math.max(2, Math.hypot(b[0]-a[0], b[1]-a[1])|0);
      for (let s=0; s<=steps; s++){
        const t=s/steps;
        const x=(a[0]+(b[0]-a[0])*t)|0, y=(a[1]+(b[1]-a[1])*t)|0;
        if (!pointInPoly(x, y, US_POLY)) continue;
        const wob = Math.sin(y*0.5 + x*0.3)*1|0;
        P(x+wob, y, PAL.shal);
        P(x+wob, y+1, PAL.mid);
        // wider for Mississippi
        if (name === 'Mississippi') P(x+wob+1, y, PAL.shal);
      }
    }
  }

  // ── ROCKIES — proper mountain sprites ──
  const rockies = [
    [72,76],[80,72],[90,80],[98,72],[78,88],[88,96],[100,92],[76,104],[86,112],
    [96,108],[80,120],[92,124],[100,118],[85,132],[95,140],[78,144],[88,148]
  ];
  for (const [mx,my] of rockies){
    if (!pointInPoly(mx, my, US_POLY)) continue;
    drawMountain(ocx, mx, my);
  }

  // ── APPALACHIANS — softer rounded mounds ──
  const apps = [[232,98],[240,104],[247,110],[253,118],[258,125],[262,132],[244,118],[251,128],[235,112],[256,140]];
  for (const [mx,my] of apps){
    if (!pointInPoly(mx, my, US_POLY)) continue;
    drawHill(ocx, mx, my);
  }

  // ── SIERRA NEVADA / CASCADES (west of Rockies, on coast side) ──
  const sierras = [[44,72],[48,82],[46,94],[50,106],[52,118],[55,130]];
  for (const [mx,my] of sierras){
    if (!pointInPoly(mx, my, US_POLY)) continue;
    drawMountain(ocx, mx, my);
  }

  // ── PINE FORESTS — multi-pixel pine sprites ──
  // PNW
  const pnwTrees = [];
  for (let i=0;i<14;i++) pnwTrees.push([35+(i%3)*4, 66+i*4]);
  // Maine
  for (let i=0;i<10;i++) pnwTrees.push([278+(i%3)*3, 50+i*3]);
  // Northern forests
  for (let i=0;i<22;i++) pnwTrees.push([170+i*4, 70+(i%2)*4]);
  for (const [tx,ty] of pnwTrees){
    if (pointInPoly(tx, ty, US_POLY)) drawPine(ocx, tx, ty);
  }

  // ── EASTERN DECIDUOUS FOREST — oak/maple style trees ──
  const eastTrees = [];
  for (let i=0;i<18;i++) eastTrees.push([200+i*4, 95+(i%3)*4]);
  for (let i=0;i<12;i++) eastTrees.push([220+i*4, 120+(i%2)*5]);
  for (const [tx,ty] of eastTrees){
    if (pointInPoly(tx, ty, US_POLY)) drawDeciduous(ocx, tx, ty);
  }

  // ── SOUTHWEST DESERT — cacti, mesas, sand dunes ──
  for (let i=0; i<14; i++){
    const cx = 75 + i*5 + (i%2)*2, cy = 154 + (i%3)*4;
    if (pointInPoly(cx, cy, US_POLY) && pointInPoly(cx, cy+3, US_POLY)) {
      drawCactus(ocx, cx, cy);
    }
  }
  // mesas
  const mesas = [[88,160],[105,158],[120,162]];
  for (const [mx,my] of mesas){
    if (pointInPoly(mx, my, US_POLY)) drawMesa(ocx, mx, my);
  }

  // ── GREAT PLAINS — grass/wheat tufts ──
  for (let i=0;i<28;i++){
    const gx = 110 + (i*9 + i*i*3)%56, gy = 78 + (i*7)%66;
    if (pointInPoly(gx, gy, US_POLY)) drawGrassTuft(ocx, gx, gy);
  }

  // ── LOUISIANA BAYOU — cypress + water patches ──
  for (let i=0;i<6;i++){
    const bx = 184+i*2, by = 162+(i%2)*2;
    if (pointInPoly(bx, by, US_POLY)){
      P(bx, by, PAL.bayouLite);
      P(bx+1, by, PAL.bayouRefl);
      P(bx, by+1, PAL.bayouDark);
    }
  }
  // cypress dots
  for (let i=0;i<4;i++){
    const cx = 185+i*3, cy = 160-(i%2)*2;
    if (pointInPoly(cx, cy, US_POLY)){
      P(cx, cy, PAL.pineDark);
      P(cx, cy+1, PAL.trunk);
    }
  }

  // ── FLORIDA SWAMP — denser water patches + palms ──
  for (let i=0;i<8;i++){
    const sx = 245+(i%2)*5, sy = 178+i*3;
    if (pointInPoly(sx, sy, US_POLY) && pointInPoly(sx+1, sy, US_POLY)){
      P(sx, sy, PAL.shal);
      P(sx+1, sy, PAL.mid);
    }
  }
  // palms
  for (let i=0;i<5;i++){
    const px_ = 242+i*2, py_ = 188+i*3;
    if (pointInPoly(px_, py_, US_POLY)) drawPalm(ocx, px_, py_);
  }

  // ── COMPASS ROSE in NW corner (decorative) ──
  drawCompass(ocx, 18, 50);

  mapBaked = oc;
}

/* ─── Map sprite primitives ─── */
function strokePath(cx, a, b, color){
  const steps = Math.max(2, Math.hypot(b[0]-a[0], b[1]-a[1])|0);
  for (let s=0; s<=steps; s++){
    const t=s/steps;
    const x=(a[0]+(b[0]-a[0])*t)|0, y=(a[1]+(b[1]-a[1])*t)|0;
    cx.fillStyle=color; cx.fillRect(x, y, 1, 1);
  }

// Biome painter — returns color or null
function paintBiome(x, y, n){
  // Florida swamp peninsula
  if (x>=232 && y>=170){
    if (n<2) return PAL.bayouDark;
    if (n<6) return PAL.bayou;
    if (n<10) return PAL.bayouLite;
    return PAL.grass1;
  }
  // Florida panhandle / Gulf coast forest
  if (x>=200 && x<232 && y>=148){
    if (n<3) return PAL.pineDark;
    if (n<8) return PAL.pineMid;
    return PAL.grass2;
  }
  // Louisiana bayou
  if (x>=180 && x<200 && y>=152){
    if (n<3) return PAL.bayouDark;
    if (n<7) return PAL.bayou;
    return PAL.bayouLite;
  }
  // Texas (semi-arid)
  if (x>=125 && x<180 && y>=148 && y<175){
    if (n<3) return PAL.sandShdw;
    if (n<8) return PAL.wheat;
    return PAL.wheatLite;
  }
  // SW Desert
  if (x>=70 && x<140 && y>=145 && y<170){
    if (n<3) return PAL.sandShdw;
    if (n<9) return PAL.sand;
    if (n<13) return PAL.sandLite;
    return PAL.sandHi;
  }
  // Southern California coast (dry chaparral)
  if (x<70 && y>=142 && y<168){
    if (n<3) return PAL.chapShdw;
    if (n<10) return PAL.chap;
    return PAL.chapLite;
  }
  // Central CA — fertile valley
  if (x<60 && y>=120 && y<142){
    if (n<4) return PAL.grass1;
    if (n<10) return PAL.grass2;
    return PAL.wheatLite;
  }
  // Pacific NW — heavy pine forest
  if (x<55 && y<120){
    if (n<3) return PAL.pineShdw;
    if (n<10) return PAL.pineDark;
    return PAL.pineMid;
  }
  // Rockies — rocky and forested mix
  if (x>=60 && x<108 && y>=66 && y<150){
    if (n<2) return PAL.snow;
    if (n<5) return PAL.rockMid;
    if (n<8) return PAL.rockDark;
    if (n<12) return PAL.pineDark;
    return PAL.pineMid;
  }
  // Great Plains
  if (x>=108 && x<175 && y>=58 && y<148){
    if (n<3) return PAL.wheatShdw;
    if (n<10) return PAL.wheat;
    return PAL.wheatLite;
  }
  // Appalachians
  if (x>=220 && x<268 && y>=88 && y<145){
    if (n<3) return PAL.appShdw;
    if (n<10) return PAL.appMid;
    return PAL.appLite;
  }
  // Eastern deciduous forest
  if (x>=170 && y<145){
    if (n<3) return PAL.pineShdw;
    if (n<10) return PAL.pineMid;
    return PAL.grass2;
  }
  // SE coastal plain
  if (x>=200 && y>=140){
    if (n<3) return PAL.grass1;
    if (n<10) return PAL.grass2;
    return PAL.grass3;
  }
  // Northern boreal / Maine
  if (x>=270 && y<70){
    if (n<3) return PAL.pineShdw;
    if (n<10) return PAL.pineDark;
    return PAL.pineMid;
  }
  return null;
}

function drawTitle(){
  // ── sunset gradient sky with banded color ──
  for (let y=0;y<165;y++){
    const t = y/165;
    let r, g, b;
    if (t < 0.25){ r = 32 + 72*(t/0.25); g = 8 + 22*(t/0.25); b = 64 + 100*(t/0.25); }
    else if (t < 0.55){ const u=(t-0.25)/0.3; r = 104 + 152*u; g = 30 + 42*u; b = 164 - 80*u; }
    else if (t < 0.78){ const u=(t-0.55)/0.23; r = 240 - 40*u; g = 72 + 80*u; b = 84 + 30*u; }
    else { const u=(t-0.78)/0.22; r = 200 - 100*u; g = 152 - 40*u; b = 114 - 60*u; }
    rect(0, y, W, 1, `rgb(${r|0},${g|0},${b|0})`);
  }
  // dithered horizon glow
  for (let x=0;x<W;x++){
    if (noise2(x, 100) > 11) px(x, 108, 'rgba(255,180,120,0.4)');
    if (noise2(x, 105) > 12) px(x, 109, 'rgba(255,160,90,0.5)');
  }

  // ── stars ──
  for (let i=0;i<70;i++){
    const sx = (i*97+13)%W, sy = (i*53+7)%55;
    const tw = ((globalT/16)+i)%30;
    if (tw > 2) px(sx, sy, '#fff');
    else if (tw > 1) px(sx, sy, '#88ccff');
  }
  // shooting star
  const ss = (globalT%600)/600;
  if (ss < 0.05){
    const sx = (ss*20*W)|0, sy = (10 + ss*40)|0;
    rect(sx, sy, 3, 1, '#fff');
    rect(sx-3, sy, 3, 1, 'rgba(255,255,255,0.5)');
  }

  // ── giant sun (with retro horizontal stripes) ──
  const sunY = 88;
  for (let r=22;r>=0;r--){
    const t = (22-r)/22;
    const cr = 255 - 18*t, cg = 180 - 80*t, cb = 80 + 80*t;
    if (r > 0) circle(W/2, sunY, r, `rgb(${cr|0},${cg|0},${cb|0})`);
  }
  // sun stripes (the "blazing horizon" cliché)
  for (let i=0;i<6;i++){
    const sy = sunY + 4 + i*3;
    const sw = Math.max(0, 44 - i*7);
    rect(W/2-sw, sy, sw*2, 1, `rgba(28,8,48,${0.7 - i*0.08})`);
  }
  // sun reflection on ocean
  for (let i=0;i<8;i++){
    const ry = 115 + i*2;
    const rw = 30 - i*2;
    rect(W/2-rw, ry, rw*2, 1, `rgba(255,170,100,${0.4 - i*0.04})`);
  }

  // ── ocean stripe ──
  rect(0, 113, W, 4, 'rgba(20,8,48,0.7)');
  for (let x=0;x<W;x+=4){
    if (noise2(x, 50) > 9) px(x, 114, '#aa6080');
  }

  // ── SKYLINE — two parallax layers ──
  // back layer (faint silhouettes)
  for (let i=0;i<14;i++){
    const bx = i*24 + 4;
    const bh = 14 + ((i*23 + 7)%18);
    rect(bx, 120-bh, 18, bh, 'rgba(20,4,38,0.6)');

    if (i%3===1) rect(bx+6, 120-bh-3, 2, 3, 'rgba(20,4,38,0.6)');
  }

    [78, 30, 18], [94, 38, 20], [112, 55, 28], [138, 40, 22],
    [158, 28, 16], [172, 48, 24], [194, 35, 20], [212, 60, 26],
    [236, 32, 18], [254, 45, 22], [272, 26, 16], [288, 38, 20]
  ];
  for (const [bx, bh, bw] of buildings){
    // body

  textCShadow('A BAND ROAD TRIP ADVENTURE', 80, '#9adcff', 1, '#000');

  // ── BAND LINEUP (with proper, non-overlapping labels) ──

  globalT++;
  if (pressed('z')){
    audio(); beep(660,0.08); beep(880,0.12,'square',0.4,0.08);
    startMusic();

  }

function drawPalm(x, baseY, flip){

  // fronds
  const fy = baseY - 36;
  const fronds = [[-1,-1],[1,-1],[-2,0],[2,0],[-1,1],[1,1]];

      rect(x+1 + dx*i + sway*dx, fy + dy*i*0.6 - 2, 2, 1, '#0a0820');

  }
  // coconut
  px(x, fy+2, '#1a0820');
  px(x+3, fy+1, '#1a0820');
}
