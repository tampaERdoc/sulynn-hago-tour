  for (let i=0;i<8;i++) rect(0, 180+i*7, W, 1, '#1a0830');

  // marquee bulbs
  for (let i=0;i<W;i+=10){
    const on = ((globalT>>3) + i)%2;
    rect(i+3, 3, 4, 4, on ? '#ffcd2a' : '#604010');
    if (on) px(i+4, 4, '#fff');
  }

  // title
  textCShadow('PICK YOUR ROCK STAR', 16, '#ff2a6d', 2, '#5a0820');

  // character cards
  for (let i=0;i<4;i++){
    const bx = 40 + i*70, by = 120;
    const sel = i === G.selIdx;
    // card bg
    rect(bx-22, by-38, 44, 80, sel ? '#3a1860' : '#1a0830');
    rect(bx-22, by-38, 44, 80, 'transparent');
    rectO(bx-22, by-38, 44, 80, sel ? '#ffcd2a' : '#3a2050');
    if (sel){
      // double border
      rectO(bx-24, by-40, 48, 84, '#ff2a6d');
      // selection arrow
      const ab = Math.sin(globalT*0.2)*2|0;
      text('V', bx-1, by-50+ab, '#ffcd2a', 2);
    }
    // band member sprite (big)
    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(1.4, 1.4);
    drawBandie(BAND[i], 0, -14, 0, sel ? globalT : 0);
    ctx.restore();
    // name + role
    text(BAND[i].short, bx - BAND[i].short.length*2 + 1, by+22, '#fff', 1);
    text(BAND[i].role, bx - BAND[i].role.length*2 + 1, by+32, '#ffcd2a', 1);
  }

  textCShadow('Z TO CONFIRM     X TO GO BACK', 215, '#aaa', 1, '#000');
  textCShadow('YOU PLAY THIS ONE AT THE FINAL SHOW', 228, '#666', 1, '#000');

  if (pressed('left')) { G.selIdx = (G.selIdx+3)%4; beep(330,0.05); }
  if (pressed('right')){ G.selIdx = (G.selIdx+1)%4; beep(330,0.05); }
  if (pressed('z')){
    G.picked = G.selIdx;
    beep(660,0.08); beep(880,0.12,'square',0.4,0.08);
    setScene('MAP', initMap);
  }
  if (pressed('x')){ setScene('TITLE'); }
  globalT++;
}

/* ───────────────────────── USA MAP ───────────────────────── */
function drawUSA(){
  bakeMap();

  // night sky gradient (over ocean too — baked map covers below y=35)
  for (let y=0;y<35;y++){
    const t = y/35;
    rect(0, y, W, 1, `rgb(${10+t*15},${5+t*10},${30+t*30})`);
  }
  // twinkling stars
  for (let i=0;i<35;i++){
    const sx = (i*97+11)%W, sy = (i*41+5)%32;
    if (((globalT/12)+i)%25 > 2) px(sx, sy, '#fff');
  }
  // moon w/ craters
  for (let r=11;r>=8;r--) circle(285, 22, r, `rgb(${255-r*4},${230-r*8},${180-r*8})`);
  px(281, 19, '#e8c890'); px(288, 23, '#e8c890'); px(284, 27, '#e8c890');

  // blit pre-baked continent + ocean
  ctx.drawImage(mapBaked, 0, 0);

  // animated wave shimmer over ocean only (avoid land by checking pixel)
  for (let y=42; y<H; y+=6){
    for (let x=0; x<W; x+=14){
      if (pointInPoly(x, y, US_POLY)) continue;
      const wv = Math.sin((globalT+y*2+x)*0.04)*2|0;
      px(x+wv, y, '#5a7aca');
      if ((x+y+globalT/2)%30 < 3) px(x+wv+1, y, '#7a9ada');
    }
  }
  // coast horizon line
  rect(0, 35, W, 1, '#5a8ada');

  // labels for major features
  text('PACIFIC', 8, 110, 'rgba(255,255,255,0.45)', 1);
  text('OCEAN', 8, 120, 'rgba(255,255,255,0.45)', 1);
  text('ATLANTIC', 282, 130, 'rgba(255,255,255,0.45)', 1);
  text('GULF', 175, 195, 'rgba(255,255,255,0.45)', 1);

  // state markers — themed regional icons
  for (let i=0;i<TOUR.length;i++){
    const s = TOUR[i];
    const done = G.collected.includes(s.animal);
    const cur = i === G.unlocked;
    if (done){
      // green checkmark pin with shadow
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.fillRect(s.mx-3, s.my+3, 6, 1);
      rect(s.mx-3, s.my-3, 7, 7, '#10401a');
      rect(s.mx-3, s.my-3, 7, 1, '#3a8a3a');
      rect(s.mx-2, s.my-2, 5, 5, '#2adc6a');
      rect(s.mx-2, s.my-2, 5, 1, '#5afca0');
      // checkmark
      px(s.mx-1, s.my, '#0a3a1a');
      px(s.mx, s.my+1, '#0a3a1a');
      px(s.mx+1, s.my, '#0a3a1a');
      px(s.mx+2, s.my-1, '#0a3a1a');
    } else if (cur){
      // pulsing glow halo
      const halo = 0.4 + 0.25*Math.sin(globalT*0.12);
      ctx.fillStyle = `rgba(255,205,42,${halo*0.4})`;
      ctx.fillRect(s.mx-9, s.my-9, 19, 19);
      ctx.fillStyle = `rgba(255,205,42,${halo*0.6})`;
      ctx.fillRect(s.mx-7, s.my-7, 15, 15);
      // themed icon
      drawCityIcon(s.id, s.mx, s.my);
      // city label banner above
      const lbl = s.city;
      const lw = lbl.length*4;
      const lx = Math.max(2, Math.min(W - lw - 4, s.mx - lw/2));
      const lby = s.my - 16;
      rect(lx-2, lby, lw+4, 9, '#1a0830');
      rect(lx-2, lby, lw+4, 1, '#ffcd2a');
      rect(lx-2, lby+8, lw+4, 1, '#ffcd2a');
      text(lbl, lx, lby+2, '#ffcd2a', 1);
      // pointer triangle from banner to icon
      px(s.mx, lby+9, '#ffcd2a');
      px(s.mx-1, lby+9, '#1a0830');
      px(s.mx+1, lby+9, '#1a0830');
    } else {
      // locked pin (greyed)
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.fillRect(s.mx-2, s.my+3, 5, 1);
      rect(s.mx-3, s.my-3, 7, 7, '#1a1a1a');
      rect(s.mx-2, s.my-2, 5, 5, '#555');
      rect(s.mx-2, s.my-2, 5, 1, '#777');
      px(s.mx, s.my, '#888');
      // padlock
      rect(s.mx-1, s.my-1, 3, 2, '#aaa');
      px(s.mx, s.my-2, '#aaa');
      px(s.mx, s.my, '#333');
    }
  }

  // tour path (dotted, lights up as completed)
  for (let i=0;i<TOUR.length-1;i++){
    const a = TOUR[i], b = TOUR[i+1];
    const steps = Math.max(8, Math.floor(Math.hypot(b.mx-a.mx,b.my-a.my)/3));
    const done = i < G.unlocked;
    for (let s=0;s<steps;s++){
      if (s%2) continue;
      const t = s/steps;
      const xx = a.mx + (b.mx-a.mx)*t;
      const yy = a.my + (b.my-a.my)*t;
      let c = '#666';
      if (done){
        // animated yellow line
        c = ((s + (globalT>>2))%6 < 3) ? '#ffcd2a' : '#a07820';
      }
      rect(xx-1, yy, 1, 1, c);
    }
  }

  // truck on map
  drawTruck(G.truck.x|0, G.truck.y|0, G.truck.dir, true, G.collected, globalT, false);
  // dust trail
  if (globalT%6 === 0) {
    const dx = G.truck.dir === 3 ? -16 : G.truck.dir === 2 ? 16 : 0;
    const dy = G.truck.dir === 0 ? -16 : G.truck.dir === 1 ? 16 : 0;
    spawnPart(G.truck.x+dx, G.truck.y+5, dx*0.05, -0.2, 25, '#9a8870', 'dust');
  }

  // HUD top bar
  rect(0, 0, W, 12, 'rgba(0,0,0,0.6)');
  text('USA TOUR MAP', 4, 4, '#ffcd2a', 1);
  text(G.collected.length+'/'+TOUR.length+' ANIMALS', 220, 4, '#fff', 1);

  // bottom info panel
  rect(0, H-40, W, 40, 'rgba(0,0,0,0.85)');
  rect(0, H-40, W, 1, '#ffcd2a');
  if (G.unlocked < TOUR.length){
    const s = TOUR[G.unlocked];
    text('NEXT STOP: '+s.city+', '+s.name, 6, H-34, '#ffcd2a', 1);
    if (s.biome === 'concert'){
      text('FINAL CONCERT! GIVE BEAR THE DRUMS!', 6, H-22, '#ff2a6d', 1);
    } else {
      text('FIND THE '+ANIMALS[s.animal].name+' AND GIVE IT A '+INSTRUMENTS[s.instr].name, 6, H-22, '#fff', 1);
    }
    text('DRIVE TO THE GLOWING STAR. Z TO ENTER.', 6, H-10, '#aaa', 1);
  }

  // band roster panel (right)
  drawRoster(W-92, H-38);
}

function drawRoster(x, y){
  rectO(x-2, y-2, 90, 28, '#3a3a5a');
  text('TOUR BUS:', x, y, '#888', 1);
  // player
  drawBandie(BAND[G.picked], x+22, y+10, 0, globalT/2);
  // collected animals row
  for (let i=0;i<G.collected.length;i++){
    drawMiniAnimal(G.collected[i], x+38 + i*9, y+12);
  }
}

function initMap(){
  if (G.truck.x === 0 && G.truck.y === 0){
    // spawn just south of Tampa, still inside Florida
    G.truck.x = TOUR[0].mx; G.truck.y = TOUR[0].my + 10; G.truck.dir = 2;
  }
}
function updateMap(){
  let dx=0,dy=0;
  if (keys.left)  { dx=-1; G.truck.dir=2; }
  if (keys.right) { dx=1;  G.truck.dir=3; }
  if (keys.up)    { dy=-1; G.truck.dir=1; }
  if (keys.down)  { dy=1;  G.truck.dir=0; }
  if (dx&&dy){ dx*=0.7; dy*=0.7; }
  G.truck.x += dx*1.0; G.truck.y += dy*1.0;
  if (dx||dy) G.truck.anim++;
  G.truck.x = Math.max(15, Math.min(W-15, G.truck.x));
  G.truck.y = Math.max(45, Math.min(H-50, G.truck.y));

  if (G.unlocked < TOUR.length){
    const s = TOUR[G.unlocked];
    const d = Math.hypot(G.truck.x - s.mx, G.truck.y - s.my);
    if (d < 9 && pressed('z')){
      beep(660,0.08); beep(990,0.12,'square',0.4,0.08);
      if (s.biome === 'concert') setScene('CONCERT', initConcert);
      else setScene('LEVEL', () => initLevel(s));
    }
  }
  globalT++;
}

/* ───────────────────────── STATE LEVEL ───────────────────────── */
function initLevel(s){
  G.level = {
    state: s,
    player: {x:30, y:200, dir:3, anim:0},
    truck: {x:18, y:200},
    animal: {x: 230 + (Math.random()*40|0), y: 100 + (Math.random()*60|0), found:false, hidden:true, anim:0},
    items: [],
    holding: null,
    won: false,
    bushes: [],
    msg: 'FIND THE '+ ANIMALS[s.animal].name + '!',
    msgT: 240,
    foliage: [],
  };
  // 3 instruments: correct + 2 wrong
  const all = Object.keys(INSTRUMENTS);
  const wrong = all.filter(k => k !== s.instr).sort(()=>Math.random()-0.5).slice(0,2);
  const items = [s.instr, ...wrong].sort(()=>Math.random()-0.5);
  for (let i=0;i<3;i++){
    G.level.items.push({
      key: items[i],
      x: 70 + i*75 + ((Math.random()*15)|0),
      y: 130 + ((Math.random()*60-30)|0),
      picked:false,
      bob: i*7,
    });
  }
  // bushes / foliage decorations
  for (let i=0;i<14;i++){
    G.level.bushes.push({
      x: 50 + ((i*47+i*i*3)%220),
      y: 95 + ((i*31)%110),
      big: (i%3===0),
      seed: i,
    });
  }
  // background tree positions
  for (let i=0;i<6;i++){
    G.level.foliage.push({x: 30 + i*50 + (i*7)%20, y: 30 + (i%2)*15});
  }
  // Bake the static portions of the scene (sky, ground, trees, water bases, lily pads, logs, bushes)
  // Excludes: fireflies, water ripples, items, animal, player, particles, HUD
  G.level.bakedBg = bakeWith(W, H, () => drawLevelStaticScene(s, G.level));
}

function drawLevelStaticScene(s, lv){
  const biomes = {
    swamp:    {sky:['#06122a','#0e1c3a','#1a2c4a','#1a3848','#1a3a3a'],
               ground:['#1a3a20','#142a18','#0e1e12','#08140a'], moonC:'#dde0a8'},
    forest:   {sky:['#0a1a2a','#1a2a4a','#2a3a5a','#3a4a6a','#3a5a4a'],
               ground:['#2a4a2a','#1e3a1e','#142a14','#0a1808'], moonC:'#e8e0c0'},
    bayou:    {sky:['#08182a','#10243a','#1a324a','#1a3848','#283e40'],
               ground:['#1a3a3a','#142a2a','#0e201e','#081414'], moonC:'#e0e0e0'},
    desert:   {sky:['#3a1a2a','#7a3a3a','#c87040','#e8a050','#f0c870'],
               ground:['#c8804a','#a86838','#80502a','#5a3818'], moonC:'#ffd070'},
    mountain: {sky:['#1a1a3a','#2a2a5a','#4a4a7a','#6a6a9a','#8aaaca'],
               ground:['#6a7a8a','#4a5a6a','#3a4a5a','#2a3a48'], moonC:'#f0f4ff'},
  };
  const B = biomes[s.biome] || biomes.swamp;

  // BANDED SKY
  const bands = B.sky;
  const skyH = 95;
  for (let y=0; y<skyH; y++){
    const t = (y/skyH) * (bands.length-1);
    const i = t|0;
    const f = t - i;
    rect(0, y, W, 1, blendHex(bands[i], bands[Math.min(i+1,bands.length-1)], f));
  }
  // sky dither
  for (let y=4; y<skyH; y+=2){
    for (let x=0; x<W; x+=2){
      const n = noise2(x, y);
      if (n === 0) px(x, y, 'rgba(255,255,255,0.06)');
      else if (n === 15) px(x, y, 'rgba(0,0,0,0.08)');
    }
  }
  // stars (baked, static positions)
  if (s.biome !== 'desert'){
    for (let i=0; i<40; i++){
      const sx = (i*97+11)%W, sy = (i*43+5)%55;
      px(sx, sy, i%3===0 ? '#88bbff' : '#fff');
    }
  }
  // MOON / SUN
  if (s.biome === 'desert'){
    for (let r=18; r>=0; r--){
      const a = (18-r)/18;
      ctx.fillStyle = `rgba(255,${180-r*4},${60+r*4},${0.05+a*0.05})`;
      ctx.beginPath(); ctx.arc(255,32,r+4,0,Math.PI*2); ctx.fill();
    }
    for (let r=14; r>=0; r--){
      const t=(14-r)/14;
      circle(255,32,r,`rgb(${255-12*t},${190-60*t},${80+40*t})`);
    }
    for (let i=0; i<4; i++) rect(243, 36+i*3, 24, 1, 'rgba(40,8,28,0.4)');
  } else {
    for (let r=14; r>=8; r--){
      ctx.fillStyle = `rgba(255,250,200,${0.06+(14-r)*0.02})`;
      ctx.beginPath(); ctx.arc(265,28,r,0,Math.PI*2); ctx.fill();
    }
    circle(265, 28, 8, B.moonC);
    ctx.fillStyle = blendHex(B.moonC,'#000',0.3);
    ctx.beginPath(); ctx.arc(267,30,7,-Math.PI/2,Math.PI/2); ctx.fill();
    circle(262,25,1,'rgba(120,120,100,0.6)');
    circle(266,30,1,'rgba(120,120,100,0.4)');
    px(269,26,'rgba(150,150,130,0.5)');
    px(263,31,'rgba(150,150,130,0.5)');
    px(262,24,'#fff');
  }

  // BIOME-SPECIFIC SCENERY (use the rich versions but baked, with t=0 so all sway is at rest)
  drawBiomeBaked(s.biome, lv);

  // BUSHES (static positions)
  for (const b of lv.bushes){
    drawFoliageBush(b.x, b.y, b.big, 0, b.seed);
  }

  // TRUCK is parked, can be baked too
  drawTruck(lv.truck.x+10, lv.truck.y, 3, true, G.collected, 0, false);
}

function drawLevel(){
  const lv = G.level;
  const s = lv.state;

  // ── BLIT BAKED STATIC SCENE ── (sky, ground, trees, water bases, lily pads, bushes, truck)
  if (lv.bakedBg) ctx.drawImage(lv.bakedBg, 0, 0);

  // ── ANIMATED OVERLAYS (fireflies, water ripples, mist, etc.) ──
  drawBiomeOverlay(s.biome, lv);

  // ── twinkling star highlight (a few stars sparkle) ──
  if (s.biome !== 'desert'){
    for (let i=0; i<8; i++){
      const sx = (i*131+11)%W, sy = (i*43+5)%55;
      const tw = ((globalT/8)+i*3)%24;
      if (tw < 3) px(sx, sy, '#fff');
    }
  }

  // dropped instruments
  for (const it of lv.items){
    if (it.picked) continue;
    const I = INSTRUMENTS[it.key];
    const bob = Math.sin((globalT+it.bob)*0.08)*1;
    // shadow
    shadow(it.x-2, it.y+10, 6, 2, 0.4);
    // sparkle
    if ((globalT>>3 + it.bob)%4 === 0){
      px(it.x+1, it.y-2+bob, '#fff');
      px(it.x-2, it.y+8, '#fff');
    }
    ctx.save(); ctx.translate(0, bob);
    I.icon(it.x, it.y);
    ctx.restore();
  }

  // animal (peeking out of bush if not yet approached)
  const a = ANIMALS[s.animal];
  if (!lv.animal.hidden){
    a.draw(lv.animal.x, lv.animal.y, globalT);
    if (lv.won){
      // music notes streaming up
      if (globalT%10 === 0){
        spawnPart(lv.animal.x + (Math.random()*10-5), lv.animal.y - 5, (Math.random()-0.5)*0.3, -0.5, 60, ['#ff2a6d','#ffcd2a','#2adc6a'][globalT%3], 'note');
      }
    }
  } else {
    const pop = Math.sin(globalT*0.08)*2|0;
    rect(lv.animal.x-2, lv.animal.y+pop+1, 5, 3, a.color);
    rect(lv.animal.x-2, lv.animal.y+pop+1, 5, 1, a.color3);
    px(lv.animal.x-1, lv.animal.y+pop+2, a.color2);
    px(lv.animal.x+1, lv.animal.y+pop+2, a.color2);
    // ? bubble if close
    const dx = lv.player.x - lv.animal.x, dy = lv.player.y - lv.animal.y;
    if (Math.hypot(dx,dy) < 36){
      const bo = Math.sin(globalT*0.2)*1|0;
      rect(lv.animal.x-1, lv.animal.y-8+bo, 5, 6, '#fff');
      px(lv.animal.x+1, lv.animal.y-6+bo, '#000');
      px(lv.animal.x+1, lv.animal.y-4+bo, '#000');
      px(lv.animal.x+1, lv.animal.y-2+bo, '#000');
    }
  }

  // player (with shadow)
  shadow(lv.player.x-4, lv.player.y+14, 8, 2, 0.4);
  drawBandie(BAND[G.picked], lv.player.x, lv.player.y, lv.player.dir, lv.player.anim);
  if (lv.holding){
    INSTRUMENTS[lv.holding].icon(lv.player.x-1, lv.player.y-12);
  }

  // particles
  drawParts();

  // HUD
  rect(0, 0, W, 14, 'rgba(0,0,0,0.75)');
  rect(0, 14, W, 1, '#ffcd2a');
  text(s.name+' - '+s.city, 4, 4, '#ffcd2a', 1);
  text('FIND: '+a.name, W-90, 4, '#fff', 1);

  // message box
  if (lv.msg && lv.msgT > 0){
    const mw = lv.msg.length*4 + 12;
    const mx = (W-mw)/2;
    rect(mx, H-32, mw, 18, '#1a0830');
    rect(mx, H-32, mw, 1, '#ffcd2a');
    rect(mx, H-15, mw, 1, '#ffcd2a');
    rect(mx, H-32, 1, 18, '#ffcd2a');
    rect(mx+mw-1, H-32, 1, 18, '#ffcd2a');
    text(lv.msg, mx+6, H-26, '#fff', 1);
  }
}

/* ─── LEVEL SCENE SPRITES ─── */
function drawFoliageBush(x, y, big, sway, seed){
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(x-1, y+(big?10:8), big?14:10, 2);
  const w = big ? 12 : 9;
  const h = big ? 9 : 7;
  // base (dark)
  rect(x-1, y+2, w, h-2, '#0a2010');
  rect(x, y+1, w-2, 1, '#0a2010');
  rect(x+1, y, w-4, 1, '#0a2010');
  // mid (sway slightly)
  rect(x+sway, y+3, w-2, h-3, '#1a4a1a');
  // light
  rect(x+1+sway, y+2, w-4, h-5, '#2a6a2a');
  rect(x+2+sway, y+3, w-6, 1, '#3a8a3a');
  // highlight specks
  if (big){
    px(x+3+sway, y+3, '#4a9a3a');
    px(x+7+sway, y+4, '#4a9a3a');
  }
  px(x+sway, y+1, '#2a6a2a'); // edge tuft
  px(x+w-1+sway, y+1, '#2a6a2a');
  // flowers
  if (big && (seed%3===0)){
    px(x+3, y+1, '#ffcd2a');
    px(x+w-3, y+2, '#ff2a6d');
    px(x+w-3, y+1, '#ffaaca');
  }
  if (seed%5===0){
    px(x+5, y, '#ff80a0');
  }
}

function drawCypress(x, y){
  // x = horizontal center, y = top of canopy. Trunk extends down ~50px from canopy bottom.
  // === FRONDS — 5 layered triangles getting wider going down ===
  const layers = [
    {dy: 0,  w: 6,  d:'#0a2010', m:'#1a4a18', h:'#3a7028'},
    {dy: 5,  w: 9,  d:'#0a2010', m:'#1a4a18', h:'#3a7028'},
    {dy: 11, w: 13, d:'#08200a', m:'#1a4a1c', h:'#2a6a20'},
    {dy: 17, w: 16, d:'#08200a', m:'#143818', h:'#2a5a20'},
    {dy: 22, w: 14, d:'#061608', m:'#102e14', h:'#1e4218'},
  ];
  for (const l of layers){
    const cy = y + l.dy;
    // dark shell
    ctx.fillStyle = l.d;
    ctx.beginPath();
    ctx.moveTo(x-l.w, cy+5); ctx.lineTo(x, cy); ctx.lineTo(x+l.w, cy+5);
    ctx.fill();
    // mid
    ctx.fillStyle = l.m;
    ctx.beginPath();
    ctx.moveTo(x-l.w+2, cy+5); ctx.lineTo(x, cy+1); ctx.lineTo(x+l.w-2, cy+5);
    ctx.fill();
    // lit side highlight (left)
    ctx.fillStyle = l.h;
    ctx.beginPath();
    ctx.moveTo(x-l.w+1, cy+4); ctx.lineTo(x-1, cy+1); ctx.lineTo(x, cy+3);
    ctx.fill();
    // little spike points on rim
    for (let i=-l.w+1; i<=l.w-1; i+=3){
      px(x+i, cy+5, l.m);
    }
  }
  // === TRUNK ===
  const tBase = y + 28;
  for (let ty=0; ty<26; ty++){
    rect(x-2, tBase+ty, 4, 1, '#3a1f10');
    rect(x-2, tBase+ty, 1, 1, '#5a3018');
    rect(x+1, tBase+ty, 1, 1, '#1a0c05');
    // bark grooves
    if (ty%4===0) px(x-1, tBase+ty, '#2a1408');
    if (ty%5===2) px(x, tBase+ty, '#1a0c05');
  }
  // trunk base flare (roots)
  rect(x-4, tBase+24, 9, 2, '#3a1f10');
  rect(x-4, tBase+24, 1, 2, '#5a3018');
  rect(x+4, tBase+24, 1, 2, '#1a0c05');
  rect(x-4, tBase+25, 9, 1, '#1a0c05');

  // === HANGING SPANISH MOSS ===
  const mossXs = [-12, -8, -4, 1, 5, 10, 13];
  for (const mx of mossXs){
    const wob = Math.sin(globalT*0.03 + mx*0.7)*1;
    const baseY = y + 24;
    const len = 6 + ((Math.abs(mx)*3 + mx*mx)%6);
    for (let i=0; i<len; i++){
      const c = (i % 4 === 0) ? '#8aaa5a' : (i % 3 === 0) ? '#6a9a4a' : '#4a7a2a';
      px(x+mx+(wob*(i/len))|0, baseY+i, c);
    }
    px(x+mx+wob|0, baseY+len, '#3a6a1a');
  }
}

function drawCypressKnee(x, y){
  rect(x-1, y, 3, 6, '#3a1f10');
  px(x-1, y, '#5a3018');
  px(x+1, y, '#1a0c05');
  px(x+1, y+5, '#0a0608');
  // moss tuft on top
  px(x, y-1, '#4a8a2a');
  px(x-1, y, '#3a6a1a');
}

function drawCattail(x, y, t){
  const sway = Math.sin(t*0.04 + x*0.1)*1;
  // stem
  for (let i=0; i<10; i++){
    const wob = sway*(i/10);
    px(x+wob|0, y-i, i%3===0 ? '#1a3a18' : '#3a6a28');
  }
  // long leaf
  for (let i=0; i<7; i++){
    px(x-2+(sway*0.5*i/7)|0, y-i-2, '#2a5a20');
  }
  for (let i=0; i<5; i++){
    px(x+3+(sway*0.4*i/5)|0, y-i-1, '#3a7028');
  }
  // brown cattail flower
  rect(x+sway|0, y-13, 2, 5, '#4a2810');
  px(x+sway|0, y-13, '#6a3a18');
  px(x+1+sway|0, y-9, '#6a3a18');
  // little fuzz at top
  px(x+sway|0, y-14, '#8a5028');
}

function drawWaterPool(x, y, w, h, t){
  // pool base
  rect(x, y, w, h, '#0e2438');
  // depth shadow at top edge
  rect(x, y, w, 2, '#06182a');
  // floor highlight near bottom
  rect(x, y+h-1, w, 1, '#1a3a4a');
  // shore edge
  rect(x-1, y, 1, h, '#0a1a08');
  rect(x+w, y, 1, h, '#0a1a08');

  // animated ripples (sin wave bands)
  for (let r=0; r<3; r++){
    const ry = y + 2 + r*3;
    for (let xi=0; xi<w; xi+=2){
      const wob = Math.sin((t*0.08 + xi*0.25 + r*1.5)) * 1;
      if (wob > 0.3) px(x+xi, ry+(wob|0), '#3a6a8a');
      if (wob > 0.7) px(x+xi+1, ry+(wob|0), '#5a8aaa');
    }
  }
  // surface glints (animated)
  for (let i=0; i<4; i++){
    const sx = x + 4 + ((i*11 + (t/8|0))%(w-8));
    const sy = y + 3 + (i%2)*4;
    rect(sx, sy, 3, 1, '#7aaaca');
    px(sx+1, sy+1, '#5a8aaa');
  }
}

function drawLilyPad(x, y, flowered){
  // round flat pad with notch
  rect(x-3, y, 7, 1, '#2a6a28');
  rect(x-3, y+1, 7, 2, '#3a8a30');
  rect(x-3, y+3, 7, 1, '#1a4a18');
  rect(x-2, y, 1, 3, '#1a4a18'); // notch / radial line
  px(x, y, '#1a4a18');
  // veins
  px(x-2, y+2, '#5aaa3a');
  px(x+2, y+2, '#5aaa3a');
  if (flowered){
    // water lily flower (multi-petal)
    rect(x, y-2, 2, 1, '#ffaaca');
    rect(x-1, y-1, 4, 1, '#ffaaca');
    px(x, y-1, '#fff');
    px(x+1, y-1, '#fff');
    px(x, y-3, '#ff7090');
  }
}

function drawLog(x, y){
  rect(x, y, 16, 4, '#3a1f10');
  rect(x, y, 16, 1, '#5a3018');
  rect(x, y+3, 16, 1, '#1a0c05');
  // tree-ring ends
  px(x, y+1, '#2a1408'); px(x, y+2, '#2a1408');
  px(x+15, y+1, '#2a1408'); px(x+15, y+2, '#2a1408');
  px(x+14, y+2, '#5a3018');
  // moss on top
  rect(x+5, y, 2, 1, '#4a8a2a');
  rect(x+9, y, 3, 1, '#3a7a1a');
  px(x+5, y-1, '#5a9a3a');
}

function drawPineTreeBig(x, y){
  // tall conifer with trunk and 4 layered canopy tiers
  // canopy tiers (top to bottom, widening)
  const tiers = [
    {dy: 0,  w: 4,  d:'#0a2a1a', m:'#1a4a2a', h:'#2a6a3a'},
    {dy: 6,  w: 8,  d:'#0a2a1a', m:'#1a4a2a', h:'#2a6a3a'},
    {dy: 14, w: 12, d:'#082818', m:'#1a4222', h:'#286830'},
    {dy: 22, w: 16, d:'#062010', m:'#143a1c', h:'#205828'},
  ];
  for (const t of tiers){
    const cy = y + t.dy;
    ctx.fillStyle = t.d;
    ctx.beginPath();
    ctx.moveTo(x-t.w, cy+8); ctx.lineTo(x, cy); ctx.lineTo(x+t.w, cy+8); ctx.fill();
    ctx.fillStyle = t.m;
    ctx.beginPath();
    ctx.moveTo(x-t.w+2, cy+8); ctx.lineTo(x, cy+2); ctx.lineTo(x+t.w-2, cy+8); ctx.fill();
    ctx.fillStyle = t.h;
    ctx.beginPath();
    ctx.moveTo(x-t.w+1, cy+7); ctx.lineTo(x-1, cy+2); ctx.lineTo(x+1, cy+5); ctx.fill();
  }
  // trunk
  const tBase = y + 30;
  rect(x-1, tBase, 3, 12, '#3a1f10');
  rect(x-1, tBase, 1, 12, '#5a3018');
  rect(x+1, tBase, 1, 12, '#1a0c05');
  for (let i=0; i<3; i++) px(x, tBase+2+i*4, '#2a1408');
  rect(x-2, tBase+11, 5, 1, '#3a1f10');
}

function drawDistantTree(x, y, c){
  // simple silhouette for far background
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x-5, y+8); ctx.lineTo(x, y); ctx.lineTo(x+5, y+8); ctx.fill();
  rect(x, y+7, 1, 4, '#0a0a0a');
}

function drawWillowTree(x, y, t){
  // trunk
  rect(x-2, y+18, 4, 30, '#3a1f10');
  rect(x-2, y+18, 1, 30, '#5a3018');
  rect(x+1, y+18, 1, 30, '#1a0c05');
  for (let i=0; i<5; i++) px(x, y+24+i*5, '#2a1408');
  // canopy mass (light up top)
  ctx.fillStyle = '#1a3a18';
  ctx.beginPath(); ctx.arc(x, y+10, 14, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a5a28';
  ctx.beginPath(); ctx.arc(x-2, y+8, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a7038';
  ctx.beginPath(); ctx.arc(x-3, y+6, 5, 0, Math.PI*2); ctx.fill();
  // WEEPING BRANCHES — long thin strands swaying
  const strands = [-12,-9,-6,-3,0,3,6,9,12];
  for (const sx of strands){
    const sway = Math.sin(t*0.03 + sx*0.4)*1.5;
    const len = 14 + (Math.abs(sx)%5);
    for (let i=0; i<len; i++){
      const wob = sway * (i/len);
      const c = i%3===0 ? '#3a7028' : i%2===0 ? '#2a5a20' : '#1a3a18';
      px(x+sx+wob|0, y+18+i, c);
    }
    px(x+sx+sway|0, y+18+len, '#5a8a3a'); // tip
  }
}

function drawSaguaro(x, y){
  // tall cactus, with two arms
  const baseY = y;
  // main column
  rect(x-2, baseY-32, 5, 32, '#2a5a28');
  rect(x-2, baseY-32, 1, 32, '#4a8a3a'); // lit side
  rect(x+2, baseY-32, 1, 32, '#143a18'); // shadow side
  // ribs (vertical lines)
  for (let i=0; i<6; i++){
    px(x-1, baseY-2-i*5, '#1a4a1c');
    px(x+1, baseY-4-i*5, '#3a7030');
  }
  // top rounded
  rect(x-1, baseY-34, 3, 2, '#2a5a28');
  px(x, baseY-35, '#2a5a28');
  // LEFT arm
  rect(x-5, baseY-22, 2, 9, '#2a5a28');
  rect(x-5, baseY-22, 1, 9, '#4a8a3a');
  rect(x-5, baseY-22, 2, 1, '#2a5a28');
  rect(x-5, baseY-24, 2, 2, '#2a5a28');
  px(x-5, baseY-25, '#2a5a28');
  // RIGHT arm (higher)
  rect(x+4, baseY-26, 2, 11, '#2a5a28');
  rect(x+4, baseY-26, 1, 11, '#4a8a3a');
  rect(x+4, baseY-26, 2, 1, '#2a5a28');
  rect(x+4, baseY-28, 2, 2, '#2a5a28');
  px(x+5, baseY-29, '#2a5a28');
  // spines (white dots)
  for (let i=0; i<7; i++) px(x, baseY-4-i*5, '#fff8a0');
  for (let i=0; i<3; i++) px(x-4, baseY-15-i*4, '#fff8a0');
  for (let i=0; i<3; i++) px(x+5, baseY-18-i*4, '#fff8a0');
  // flower
  rect(x, baseY-36, 2, 1, '#ff80a0');
  px(x, baseY-37, '#ffcdcd');
}

function drawDuneRow(t){
  for (let x=0; x<W; x+=24){
    const w = 28;
    ctx.fillStyle = '#a86838';
    ctx.beginPath(); ctx.moveTo(x, 230); ctx.quadraticCurveTo(x+12, 218, x+w, 230); ctx.fill();
    ctx.fillStyle = '#c88848';
    ctx.beginPath(); ctx.moveTo(x+2, 230); ctx.quadraticCurveTo(x+12, 220, x+w-2, 230); ctx.fill();
  }
  // ripples on sand
  for (let i=0; i<W; i+=6){
    const wob = Math.sin((t+i)*0.05)*1|0;
    px(i, 226+wob, '#8a5028');
  }
}

function drawSnowPeak(x, y, h){
  // base rocky body
  ctx.fillStyle = '#2a2a4a';
  ctx.beginPath(); ctx.moveTo(x-h*0.8, y+h); ctx.lineTo(x, y); ctx.lineTo(x+h*0.8, y+h); ctx.fill();
  // lit face
  ctx.fillStyle = '#4a4a6a';
  ctx.beginPath(); ctx.moveTo(x-h*0.5, y+h*0.7); ctx.lineTo(x, y+5); ctx.lineTo(x+h*0.1, y+h*0.7); ctx.fill();
  // shadow face
  ctx.fillStyle = '#1a1a3a';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+h*0.8, y+h); ctx.lineTo(x+h*0.3, y+h); ctx.fill();
  // snow cap (jagged)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(x-h*0.35, y+h*0.45);
  ctx.lineTo(x-h*0.2, y+h*0.25);
  ctx.lineTo(x-h*0.1, y+h*0.35);
  ctx.lineTo(x, y+h*0.05);
  ctx.lineTo(x+h*0.1, y+h*0.3);
  ctx.lineTo(x+h*0.2, y+h*0.18);
  ctx.lineTo(x+h*0.3, y+h*0.42);
  ctx.lineTo(x+h*0.15, y+h*0.55);
  ctx.lineTo(x-h*0.15, y+h*0.5);
  ctx.fill();
  // snow shadow
  ctx.fillStyle = '#c8d4e0';
  ctx.beginPath();
  ctx.moveTo(x, y+h*0.05); ctx.lineTo(x+h*0.1, y+h*0.3); ctx.lineTo(x+h*0.3, y+h*0.42); ctx.lineTo(x+h*0.15, y+h*0.5); ctx.fill();
}

function drawForestTree(x, y){
  // standard pine variant for forest
  drawPineTreeBig(x, y);
}

function drawMushroom(x, y){
  rect(x-1, y-1, 1, 3, '#f0f0e0'); // stalk
  // cap
  rect(x-2, y-3, 5, 1, '#a02020');
  rect(x-3, y-2, 7, 2, '#c02828');
  px(x-2, y-1, '#fff'); // spot
  px(x+1, y-2, '#fff');
  rect(x-3, y, 7, 1, '#7a1010');
}

function drawFern(x, y, t){
  // fern frond with multiple leaflets
  const sway = Math.sin(t*0.04 + x*0.1)*1;
  // stem
  for (let i=0; i<6; i++){
    px(x+(sway*i/6)|0, y-i, '#3a6a2a');
  }
  // leaflets
  for (let i=1; i<6; i++){
    const sw = sway*(i/6);
    px(x-i+sw|0, y-i, '#4a8a3a');
    px(x+i+sw|0, y-i, '#4a8a3a');
    if (i>2) {
      px(x-i-1+sw|0, y-i-1, '#3a7028');
      px(x+i+1+sw|0, y-i-1, '#3a7028');
    }
  }
}

function drawWaterRipples(x, y, w, h, t){
  for (let r=0; r<3; r++){
    const ry = y + 2 + r*3;
    for (let xi=0; xi<w; xi+=2){
      const wob = Math.sin((t*0.08 + xi*0.25 + r*1.5));
      if (wob > 0.3) px(x+xi, ry+(wob|0), '#3a6a8a');
      if (wob > 0.7) px(x+xi+1, ry+(wob|0), '#5a8aaa');
    }
  }
  for (let i=0; i<4; i++){
    const sx = x + 4 + ((i*11 + (t/8|0))%(w-8));
    const sy = y + 3 + (i%2)*4;
    rect(sx, sy, 3, 1, '#7aaaca');
    px(sx+1, sy+1, '#5a8aaa');
  }
}

function drawMossSway(x, y){
  // animate just a few sway pixels on top of baked Spanish moss
  const mossXs = [-12,-8,-4,1,5,10,13];
  for (const mx of mossXs){
    const wob = Math.sin(globalT*0.03 + mx*0.7)*1;
    const baseY = y + 24;
    const len = 6 + ((Math.abs(mx)*3 + mx*mx)%6);
    // animate just the tip
    const tipX = x+mx+wob|0;
    px(tipX, baseY+len, '#5a8a3a');
    px(tipX, baseY+len-1, '#4a7a2a');
  }
}

function drawWillowBranches(x, y, t){
  // re-paint just the swaying ends of willow branches
  const strands = [-12,-9,-6,-3,0,3,6,9,12];
  for (const sx of strands){
    const sway = Math.sin(t*0.03 + sx*0.4)*1.5;
    const len = 14 + (Math.abs(sx)%5);
    for (let i=Math.max(0, len-4); i<len; i++){
      const wob = sway * (i/len);
      px(x+sx+wob|0, y+18+i, i%2===0 ? '#3a7028' : '#1a3a18');
    }
    px(x+sx+sway|0, y+18+len, '#5a8a3a');
  }
}

function blendHex(c1, c2, t){
  const a = parseInt(c1.slice(1), 16);
  const b = parseInt(c2.slice(1), 16);
  const r = ((a>>16)&255)*(1-t) + ((b>>16)&255)*t;
  const g = ((a>>8)&255)*(1-t) + ((b>>8)&255)*t;
  const bl = (a&255)*(1-t) + (b&255)*t;
  return `rgb(${r|0},${g|0},${bl|0})`;
}

function updateLevel(){
  const lv = G.level;
  if (lv.msgT > 0) lv.msgT--;
  let dx=0,dy=0;
  if (keys.left)  { dx=-1; lv.player.dir=2; }
  if (keys.right) { dx=1;  lv.player.dir=3; }
  if (keys.up)    { dy=-1; lv.player.dir=1; }
  if (keys.down)  { dy=1;  lv.player.dir=0; }
  if (dx&&dy){ dx*=0.7; dy*=0.7; }
  lv.player.x += dx*1.4; lv.player.y += dy*1.4;
  if (dx||dy) {
    lv.player.anim++;
    if (lv.player.anim % 18 === 0 && !muted) beep(180, 0.04, 'triangle', 0.08);
  }
  lv.player.x = Math.max(8, Math.min(W-8, lv.player.x));
  lv.player.y = Math.max(80, Math.min(H-20, lv.player.y));

  // pick up
  for (const it of lv.items){
    if (it.picked) continue;
    if (Math.hypot(lv.player.x - it.x, lv.player.y - it.y) < 12){
      if (pressed('z') && !lv.holding){
        it.picked = true;
        lv.holding = it.key;
        beep(660,0.06); beep(880,0.10,'square',0.4,0.05);
        lv.msg = 'PICKED UP '+INSTRUMENTS[it.key].name+'!';
        lv.msgT = 90;
        // sparkle
        for (let i=0;i<8;i++) spawnPart(it.x+1, it.y+5, (Math.random()-0.5)*1.5, -Math.random()*1.5, 30, '#ffcd2a', 'spark');
      }
    }
  }
  // drop
  if (lv.holding && pressed('x')){
    const k = lv.holding;
    lv.holding = null;
    const item = lv.items.find(i => i.key===k);
    item.picked = false;
    item.x = lv.player.x; item.y = lv.player.y+8;
    beep(220,0.06);
  }

  // approach animal
  const a = lv.animal;
  const dist = Math.hypot(lv.player.x - a.x, lv.player.y - a.y);
  if (dist < 20){
    if (a.hidden){
      a.hidden = false;
      lv.msg = ANIMALS[lv.state.animal].name+' APPEARS! GIVE IT AN INSTRUMENT (Z)';
      lv.msgT = 180;
      beep(440,0.08); beep(660,0.12,'square',0.4,0.05);
      // bush rustle particles
      for (let i=0;i<10;i++) spawnPart(a.x, a.y+5, (Math.random()-0.5)*1.5, -Math.random()*1.2, 25, '#3a8a4a', 'spark');
    }
    if (pressed('z') && lv.holding && !lv.won){
      if (lv.holding === lv.state.instr){
        lv.won = true;
        lv.msg = ANIMALS[lv.state.animal].name+' LOVES THE '+INSTRUMENTS[lv.state.instr].name+'!';
        lv.msgT = 240;
        beep(523,0.08); beep(659,0.08,'square',0.4,0.08); beep(784,0.16,'square',0.4,0.16);
        const snd = ANIMALS[lv.state.animal].sound;
        snd.forEach((f,i) => beep(f, 0.18, 'sawtooth', 0.25, 0.25+i*0.12));
        // confetti
        for (let i=0;i<30;i++) spawnPart(a.x, a.y, (Math.random()-0.5)*3, -Math.random()*2-1, 60,
          ['#ff2a6d','#ffcd2a','#2adc6a','#2a8cff','#a02aff'][i%5], 'confetti');
        setTimeout(() => {
          G.collected.push(lv.state.animal);
          G.unlocked++;
          setScene('MAP', initMap);
        }, 2000);
      } else {
        lv.msg = 'NOT MY VIBE... TRY ANOTHER!';
        lv.msgT = 120;
        beep(200,0.08,'square',0.3); beep(150,0.16,'square',0.3,0.08);
        const item = lv.items.find(i => i.key===lv.holding);
        item.picked = false;
        item.x = lv.player.x + ((Math.random()*30-15)|0);
        item.y = lv.player.y + ((Math.random()*20-10)|0);
        lv.holding = null;
      }
    }
  }
  updateParts();
  globalT++;
}

/* ───────────────────────── CONCERT FINALE ───────────────────────── */
function initConcert(){
  G.concert = {
    notes: [], nextSpawn: 60, spawnRate: 50,
    score: 0, combo: 0, maxCombo: 0, hits: 0, misses: 0,
    time: 0, total: 60*45, // 45 seconds
    feedback: '', fbT: 0,
    finished: false,
    crowdJump: 0,
    laserT: 0,
    smokeT: 0,
    phase: 'tutorial', // 'tutorial' -> 'countdown' -> 'playing' -> finished
    phaseT: 0,
    demoKey: 0,        // demo arrow key animator for tutorial
  };
}

const LANES = ['left','down','up','right'];
const LANE_X = [80, 130, 180, 230];
const HIT_Y = 200;

function drawConcert(){
  const cc = G.concert;

  // night sky w/ Hollywood Hills
  for (let y=0;y<H;y++){
    const t = y/H;
    rect(0, y, W, 1, `rgb(${10+t*25},${5+t*5},${40+t*20})`);
  }
  // stars
  for (let i=0;i<30;i++){
    const sx = (i*97 + (globalT>>3))%W, sy = (i*23)%50;
    px(sx, sy, '#fff');
  }
  // Hollywood sign on distant hill
  rect(40, 40, 240, 30, '#1a0830');
  ctx.fillStyle = '#1a0830';
  ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(120, 35); ctx.lineTo(200, 50); ctx.lineTo(320, 65); ctx.lineTo(320, 75); ctx.lineTo(0, 75); ctx.fill();
  // sign
  textCShadow('HOLLYWOOD', 38, '#fff', 1, '#000');

  // bowl arches (concentric)
  for (let i=0;i<5;i++){
    const r = 90 - i*8;
    ctx.fillStyle = `rgb(${40+i*8},${10+i*4},${60-i*4})`;
    rect(W/2-r, 60+i*4, r*2, 5, ctx.fillStyle);
  }
  // marquee bulbs around arches
  for (let i=0;i<W;i+=10){
    const on = ((globalT>>3) + i)%2;
    if (i > 40 && i < W-40) {
      const ay = 60 + Math.abs(i - W/2)*0.08;
      rect(i, ay, 2, 2, on ? '#ffcd2a' : '#604010');
    }
  }
  // big neon "SULYNN HAGO LIVE"
  const flick = (globalT>>2)%20 < 18;
  textCShadow('SULYNN HAGO', 18, flick ? '#ff2a6d' : '#5a0820', 2, '#3a0010');
  textCShadow('LIVE TONIGHT', 80, '#ffcd2a', 1, '#5a3a00');

  // stage floor with checker pattern
  rect(20, 100, W-40, 50, '#3a1850');
  rect(20, 100, W-40, 2, '#5a3070');
  for (let i=0;i<W-40;i+=8){
    for (let j=0;j<50;j+=8){
      if (((i/8)+(j/8))%2) rect(20+i, 100+j, 8, 8, '#2a1040');
    }
  }
  // stage front lights
  for (let i=0;i<10;i++) rect(28+i*28, 148, 4, 2, ((globalT>>2)+i)%2 ? '#ffcd2a' : '#5a3a00');

  // sweeping spotlights from above
  cc.laserT++;
  for (let i=0;i<4;i++){
    const lx = 40 + i*80;
    const sw = Math.sin(cc.laserT*0.02 + i*1.5)*40;
    ctx.fillStyle = `rgba(${i%2?'255,42,109':'42,140,255'},0.12)`;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx + sw - 25, 150);
    ctx.lineTo(lx + sw + 25, 150);
    ctx.closePath(); ctx.fill();
  }
  // stage lights at top
  for (let i=0;i<5;i++){
    rect(40 + i*60, 0, 6, 6, '#1a1a1a');
    rect(41 + i*60, 6, 4, 2, ((globalT>>3)+i)%2 ? '#ffcd2a' : '#604010');
  }

  // band on stage: player + collected animals
  const stageY = 125;
  const total = 1 + G.collected.length;
  const startX = W/2 - (total*22)/2 + 11;
  // player
  drawBandieStage(BAND[G.picked], startX, stageY, globalT);
  // animals
  for (let i=0;i<G.collected.length;i++){
    const ax = startX + 22 + i*22;
    const ay = stageY + 6;
    const aKey = G.collected[i];
    // little jump on hit
    const jumpOffset = (cc.combo > 0 && (globalT + i*7)%12 < 6) ? -2 : 0;
    ANIMALS[aKey].draw(ax, ay + jumpOffset, globalT);
    const aStr = TOUR.find(t => t.animal===aKey).instr;
    INSTRUMENTS[aStr].icon(ax+9, ay-3 + jumpOffset);
  }
  // music notes flowing up from stage during play
  if (!cc.finished && globalT%6 === 0 && cc.combo > 0){
    spawnPart(startX + Math.random()*total*22, stageY+5, (Math.random()-0.5)*0.4, -0.8, 60,
      ['#ff2a6d','#ffcd2a','#2adc6a','#2a8cff'][globalT%4], 'note');
  }

  // crowd (multi-layer, animated)
  for (let i=0;i<W;i+=3){
    const r = ((i*7)%4);
    const hop = (cc.combo > 5 && ((i + (globalT>>2))%6 < 3)) ? 1 : 0;
    rect(i, H-18+hop, 3, 6, '#1a0a2a');
    if (cc.combo > 10){
      // raised arms
      px(i+1, H-22+hop, '#1a0a2a');
    }
    if (r === 0) px(i+1, H-15+hop, '#888');
  }
  // foreground silhouettes (closer crowd)
  for (let i=0;i<W;i+=5){
    rect(i, H-12, 4, 12, '#0a0420');
    if ((i + globalT)%15 < 5) px(i+2, H-13, '#1a0a30');
  }

  // note highway
  // background fade
  rect(45, 30, 240, 170, 'rgba(0,0,0,0.4)');
  rectO(45, 30, 240, 170, 'rgba(255,255,255,0.15)');
  // lanes
  for (let i=0;i<4;i++){
    const lx = LANE_X[i];
    // lane shadow
    rect(lx-12, 30, 24, HIT_Y-30, 'rgba(0,0,0,0.3)');
    rectO(lx-12, 30, 24, HIT_Y-30, 'rgba(255,255,255,0.2)');
    // hit zone
    const hit = cc.fbT > 0 && i === cc.lastLane;
    rect(lx-12, HIT_Y, 24, 8, hit ? '#ffcd2a44' : 'rgba(255,255,255,0.1)');
    rectO(lx-12, HIT_Y, 24, 8, '#ffcd2a');
    // arrow indicator at bottom of lane
    drawLaneArrow(i, lx, HIT_Y+1, '#ffcd2a');
    // key label
    const labels = ['←','↓','↑','→'];
    text(labels[i] === '←' ? '<' : labels[i] === '↓' ? 'V' : labels[i] === '↑' ? '^' : '>', lx-1, HIT_Y+10, '#ffcd2a', 1);
  }

  // falling notes (chunky arrow blocks)
  for (const n of cc.notes){
    if (n.dead) continue;
    const c = ['#ff2a6d','#2adc6a','#2a8cff','#a02aff'][n.lane];
    const cDark = ['#7a1030','#108040','#103a8a','#400870'][n.lane];
    // glow trail
    rect(LANE_X[n.lane]-10, n.y-6, 20, 12, c+'44');
    // body
    rect(LANE_X[n.lane]-10, n.y-5, 20, 10, c);
    rect(LANE_X[n.lane]-10, n.y-5, 20, 2, '#fff');
    rect(LANE_X[n.lane]-10, n.y+3, 20, 2, cDark);
    rectO(LANE_X[n.lane]-10, n.y-5, 20, 10, '#fff');
    drawLaneArrow(n.lane, LANE_X[n.lane], n.y-3, '#fff');
  }

  // HUD top
  rect(0, 0, W, 14, 'rgba(0,0,0,0.85)');
  rect(0, 14, W, 1, '#ffcd2a');
  text('SCORE: '+cc.score, 4, 4, '#ffcd2a', 1);
  const comboC = cc.combo > 20 ? '#ff2a6d' : cc.combo > 10 ? '#ffcd2a' : cc.combo > 5 ? '#2adc6a' : '#fff';
  text('COMBO: '+cc.combo, 90, 4, comboC, 1);
  text('HIT: '+cc.hits, 170, 4, '#2adc6a', 1);
  text('MISS: '+cc.misses, 220, 4, '#ff6a6a', 1);
  const left = Math.max(0, cc.total - cc.time);
  text('TIME: '+Math.ceil(left/60), W-50, 4, '#fff', 1);

  // big combo display
  if (cc.combo >= 10){
    const cp = Math.sin(globalT*0.3)*1|0;
    textCShadow(cc.combo+' COMBO', 230+cp, '#ff2a6d', 2, '#000');
  }

  // feedback popup
  if (cc.fbT > 0){
    const popup_y = 170 - (18 - cc.fbT);
    textCShadow(cc.feedback, popup_y, cc.feedback==='PERFECT!' ? '#ffcd2a' : cc.feedback==='GREAT!' ? '#2adc6a' : cc.feedback==='GOOD' ? '#fff' : '#ff6a6a', 2, '#000');
  }

  // particles
  drawParts();

  // ─── TUTORIAL OVERLAY ───
  if (cc.phase === 'tutorial'){
    // dim the stage so the instructions pop
    rect(0, 0, W, H, 'rgba(0,0,4,0.75)');

    // outer panel
    const px0 = 26, py0 = 28, pw = W-52, ph = 184;
    rect(px0, py0, pw, ph, '#1a0830');
    rect(px0, py0, pw, 1, '#ffcd2a');
    rect(px0, py0+ph-1, pw, 1, '#ffcd2a');
    rect(px0, py0, 1, ph, '#ffcd2a');
    rect(px0+pw-1, py0, 1, ph, '#ffcd2a');
    rect(px0+2, py0+2, pw-4, 1, '#ff2a6d');

    // title
    textCShadow('HOW TO ROCK', py0+8, '#ffcd2a', 2, '#5a3a00');
    rect(W/2-50, py0+22, 100, 1, '#ff2a6d');

    // four lane example with key labels
    const exY = py0 + 36;
    const colors = ['#ff2a6d','#2adc6a','#2a8cff','#a02aff'];
    const keys   = ['LEFT','DOWN','UP','RIGHT'];
    const arrowChars = ['<','V','^','>'];
    for (let i=0;i<4;i++){
      const lx = px0 + 30 + i*52;
      // lane chip
      rect(lx-12, exY, 24, 28, '#0a0418');
      rect(lx-12, exY, 24, 1, colors[i]);
      rect(lx-12, exY+27, 24, 1, colors[i]);
      // arrow note (animated, "falling")
      const fall = (cc.phaseT + i*15) % 60;
      const ny = exY + 2 + (fall * 22/60);
      rect(lx-9, ny, 18, 6, colors[i]);
      rect(lx-9, ny, 18, 1, '#fff');
      text(arrowChars[i], lx-1, ny+1, '#000', 1);
      // hit zone marker at bottom
      rect(lx-10, exY+22, 20, 3, 'rgba(255,205,42,0.4)');
      rectO(lx-10, exY+22, 20, 3, '#ffcd2a');
      // key label below
      text(keys[i], lx - keys[i].length*2 + 1, exY+32, colors[i], 1);
      // demo press flash
      if (cc.demoKey === i){
        rectO(lx-12, exY, 24, 28, '#fff');
        textC('PRESS!', exY+14, '#fff', 1);
        // mini sparkle
        px(lx, exY+22, '#fff');
      }
    }

    // instructions
    let iy = py0 + 86;
    textC('NOTES FALL FROM THE TOP IN 4 COLORED LANES', iy, '#fff', 1); iy+=10;
    textC('PRESS THE MATCHING ARROW WHEN A NOTE', iy, '#fff', 1); iy+=10;
    textC('REACHES THE YELLOW HIT BAR AT THE BOTTOM', iy, '#fff', 1); iy+=14;
    textC('PERFECT TIMING = MORE POINTS', iy, '#ffcd2a', 1); iy+=10;
    textC('BUILD COMBOS FOR MASSIVE BONUSES', iy, '#ff2a6d', 1); iy+=10;
    textC('YOUR ANIMALS PLAY ALONG ON EVERY HIT!', iy, '#2adc6a', 1); iy+=14;

    // prompt
    if ((cc.phaseT>>4)%2){
      const pp = 'PRESS Z OR ANY ARROW TO START';
      textCShadow(pp, py0+ph-12, '#fff', 1, '#000');
    }
    return;
  }

  // ─── COUNTDOWN OVERLAY ───
  if (cc.phase === 'countdown'){
    rect(0, 0, W, H, 'rgba(0,0,4,0.5)');
    const n = 3 - ((cc.phaseT/60)|0);
    if (cc.phaseT < 180){
      // big pulsing number
      const pulse = (cc.phaseT % 60) / 60;
      const sz = 6 - (pulse*2|0);
      textC(n+'', H/2-16, '#ffcd2a', sz);
      textCShadow('GET READY!', H/2+8, '#fff', 1, '#000');
    }
    return;
  }

  if (cc.finished){
    // dark overlay
    rect(0, 0, W, H, 'rgba(0,0,0,0.7)');
    // result panel
    rect(30, 60, W-60, 130, '#1a0830');
    rectO(30, 60, W-60, 130, '#ffcd2a');
    rectO(32, 62, W-64, 126, '#ff2a6d');
    const accuracy = cc.hits + cc.misses > 0 ? Math.round(cc.hits*100/(cc.hits+cc.misses)) : 0;
    textCShadow('SHOW COMPLETE!', 76, '#ffcd2a', 2, '#5a3a00');
    text('SCORE:', 60, 110, '#fff', 1);    text(cc.score+'', W-100, 110, '#ffcd2a', 1);
    text('MAX COMBO:', 60, 124, '#fff', 1);text(cc.maxCombo+'', W-100, 124, '#ffcd2a', 1);
    text('ACCURACY:', 60, 138, '#fff', 1); text(accuracy+'%', W-100, 138, '#ffcd2a', 1);
    text('ANIMALS:', 60, 152, '#fff', 1);  text(G.collected.length+'/6', W-100, 152, '#ffcd2a', 1);
    const grade = accuracy>=90?'S':accuracy>=80?'A':accuracy>=65?'B':accuracy>=50?'C':'D';
    const gradeC = grade==='S'?'#ffcd2a':grade==='A'?'#2adc6a':grade==='B'?'#2a8cff':grade==='C'?'#fff':'#888';
    textCShadow('GRADE: '+grade, 168, gradeC, 2, '#000');
    if ((globalT>>4)%2) textCShadow('PRESS Z TO ROCK ON', 186, '#fff', 1, '#000');
    // celebratory confetti
    if (globalT % 4 === 0){
      for (let i=0;i<3;i++){
        spawnPart(Math.random()*W, -5, (Math.random()-0.5)*1, Math.random()*1.5+0.5, 200,
          ['#ff2a6d','#ffcd2a','#2adc6a','#2a8cff','#a02aff'][i%5], 'confetti');
      }
    }
  }
}

function drawLaneArrow(lane, x, y, c){
  if (lane === 0){ // left
    px(x-3, y, c); px(x-2, y-1, c); px(x-2, y+1, c);
    px(x-1, y-2, c); px(x-1, y+2, c);
    rect(x-3, y-1, 6, 3, c);
  } else if (lane === 1){ // down
    rect(x-1, y-3, 3, 4, c);
    px(x-2, y, c); px(x+2, y, c);
    px(x-2, y+1, c); px(x+2, y+1, c);
    px(x, y+2, c);
  } else if (lane === 2){ // up
    rect(x-1, y, 3, 4, c);
    px(x-2, y, c); px(x+2, y, c);
    px(x-2, y-1, c); px(x+2, y-1, c);
    px(x, y-2, c);
  } else { // right
    px(x+3, y, c); px(x+2, y-1, c); px(x+2, y+1, c);
    px(x+1, y-2, c); px(x+1, y+2, c);
    rect(x-3, y-1, 6, 3, c);
  }
}

const STAGE_KEYS = ['left','down','up','right'];
function updateConcert(){
  const cc = G.concert;
  if (cc.finished){
    if (pressed('z')){
      G.win = true;
      G.unlocked = TOUR.length;
      G.collected = []; G.fadeDir = 1;
      G.next = () => { G.scene = 'TITLE'; G.fadeDir = -1; globalT = 0; G.collected = []; G.unlocked = 0; G.truck = {x:0,y:0,dir:3,anim:0}; };
    }
    updateParts();
    globalT++;
    return;
  }

  // ─── TUTORIAL PHASE — wait for player ───
  if (cc.phase === 'tutorial'){
    cc.phaseT++;
    cc.demoKey = ((cc.phaseT/24)|0) % 4;
    // any arrow press dismisses; or auto-advance after 8 sec
    if (pressed('z') || pressed('left') || pressed('right') || pressed('up') || pressed('down') || cc.phaseT > 480){
      cc.phase = 'countdown';
      cc.phaseT = 0;
      beep(660, 0.1, 'square', 0.3);
    }
    updateParts(); globalT++; return;
  }
  // ─── COUNTDOWN PHASE — 3, 2, 1, GO! ───
  if (cc.phase === 'countdown'){
    cc.phaseT++;
    if (cc.phaseT === 1)   beep(440, 0.15, 'square', 0.3);
    if (cc.phaseT === 60)  beep(440, 0.15, 'square', 0.3);
    if (cc.phaseT === 120) beep(440, 0.15, 'square', 0.3);
    if (cc.phaseT === 180){
      beep(880, 0.3, 'square', 0.4);
      cc.phase = 'playing';
      cc.phaseT = 0;
      // pre-populate first few notes so something shows up immediately
      for (let i=0;i<3;i++){
        cc.notes.push({lane: Math.floor(Math.random()*4), y: -60 - i*40, dead:false});
      }
    }
    updateParts(); globalT++; return;
  }

  // ─── PLAYING ───
  cc.time++;
  cc.nextSpawn--;
  if (cc.nextSpawn <= 0){
    cc.notes.push({lane: Math.floor(Math.random()*4), y: 30, dead:false});
    cc.spawnRate = Math.max(20, 50 - cc.time/240);
    cc.nextSpawn = cc.spawnRate;
  }
  for (const n of cc.notes){
    if (n.dead) continue;
    n.y += 2.4;
    if (n.y > HIT_Y + 12){
      n.dead = true;
      cc.combo = 0;
      cc.misses++;
      cc.feedback = 'MISS';
      cc.fbT = 20;
      beep(120, 0.1, 'sawtooth', 0.18);
    }
  }
  for (let i=0;i<4;i++){
    if (pressed(STAGE_KEYS[i])){
      let best = null, bestDist = 99;
      for (const n of cc.notes){
        if (n.dead || n.lane !== i) continue;
        const d = Math.abs(n.y - HIT_Y);
        if (d < bestDist){ bestDist = d; best = n; }
      }
      if (best && bestDist < 15){
        best.dead = true;
        cc.hits++; cc.combo++;
        cc.maxCombo = Math.max(cc.maxCombo, cc.combo);
        cc.lastLane = i;
        let pts = 10;
        if (bestDist < 4){ pts = 30; cc.feedback = 'PERFECT!'; }
        else if (bestDist < 9){ pts = 20; cc.feedback = 'GREAT!'; }
        else { pts = 10; cc.feedback = 'GOOD'; }
        cc.score += pts * (1 + Math.floor(cc.combo/10));
        cc.fbT = 20;
        const tune = [262,330,392,523,659,784,392,523];
        beep(tune[cc.hits%tune.length], 0.10, 'square', 0.25);
        if (G.collected.length>0){
          const a = G.collected[cc.hits%G.collected.length];
          const snd = ANIMALS[a].sound;
          beep(snd[cc.hits%snd.length], 0.08, 'triangle', 0.18);
        }
        // hit particles
        for (let k=0;k<5;k++){
          spawnPart(LANE_X[i], HIT_Y, (Math.random()-0.5)*2, -Math.random()*2, 25,
            ['#ff2a6d','#2adc6a','#2a8cff','#a02aff'][i], 'spark');
        }
      } else {
        cc.combo = 0;
        cc.feedback = 'MISS';
        cc.fbT = 16;
        beep(110, 0.1, 'sawtooth', 0.18);
      }
    }
  }
  if (cc.fbT > 0) cc.fbT--;
  if (cc.time >= cc.total){
    cc.finished = true;
    [523,659,784,1046].forEach((f,i) => beep(f, 0.3, 'square', 0.3, i*0.15));
  }
  updateParts();
  globalT++;
}

/* ───────────────────────── MAIN LOOP ───────────────────────── */
function loop(){
  rect(0,0,W,H,'#000');
  if (G.scene === 'TITLE') drawTitle();
  else if (G.scene === 'CHARSEL') drawCharSel();
  else if (G.scene === 'MAP') { drawUSA(); updateMap(); }
  else if (G.scene === 'LEVEL') { drawLevel(); updateLevel(); }
  else if (G.scene === 'CONCERT') { drawConcert(); updateConcert(); }

  if (flashT > 0){
    rect(0, H/2-8, W, 14, 'rgba(0,0,0,0.75)');
    textCShadow(flash, H/2-4, '#ffcd2a', 1, '#000');
    flashT--;
  }

  if (G.fadeDir > 0){
    G.fade = Math.min(1, G.fade + 0.06);
    if (G.fade >= 1 && G.next){ const n = G.next; G.next = null; n(); }
  } else {
    G.fade = Math.max(0, G.fade - 0.06);
  }
  if (G.fade > 0.01) rect(0, 0, W, H, `rgba(0,0,0,${G.fade})`);

  requestAnimationFrame(loop);
}
loop();
})();
